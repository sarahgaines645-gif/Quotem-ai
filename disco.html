<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The disco</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#04040a; --text:#f2f2f6; --muted:rgba(242,242,246,.6); --accent:#ff2d95; --cyan:#00f0ff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Space Grotesk',system-ui,sans-serif; overflow:hidden; }
    #yt-hide { position:fixed; left:0; bottom:0; width:320px; height:180px; z-index:0; opacity:.01; pointer-events:none; }
    #stage { position:fixed; inset:0; z-index:1; display:block; }
    header { position:fixed; top:0; left:0; right:0; padding:16px 20px; z-index:10; display:flex;
             align-items:baseline; gap:14px; pointer-events:none;
             background:linear-gradient(180deg, rgba(4,4,10,.75), rgba(4,4,10,0)); }
    header .brand { font-size:22px; font-weight:700; color:#fff; text-shadow:0 0 6px #fff,0 0 18px var(--accent),0 0 40px var(--accent); }
    header .sub { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); }
    .bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10; display:flex; gap:8px;
           flex-wrap:wrap; justify-content:center; max-width:min(820px,calc(100vw - 20px));
           background:rgba(12,12,20,.93); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:12px 14px;
           box-shadow:0 24px 60px -18px #000, 0 0 30px -12px rgba(0,240,255,.25); }
    .b { border:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:600; padding:9px 15px;
         border-radius:14px; background:#12121b; color:var(--text); box-shadow:0 0 0 1px rgba(255,255,255,.12); }
    .b.hero { background:#1a1020; box-shadow:0 0 0 1px rgba(255,45,149,.7), 0 0 18px rgba(255,45,149,.3); }
    .b.on { box-shadow:0 0 0 1px var(--cyan), 0 0 16px rgba(0,240,255,.35); }
    .note { width:100%; text-align:center; font-size:11px; color:var(--muted); margin-top:2px; }
    video { display:none; }
  </style>
</head>
<body>
  <div id="yt-hide"><div id="yt"></div></div>
  <canvas id="stage"></canvas>

  <header>
    <span class="brand">Q<span style="color:var(--cyan)">.</span></span>
    <span class="sub">The disco</span>
  </header>

  <!-- THREE COPIES OF THE SAME CLIP, started at different points.
       One video element cannot be at two times at once, so each dancer that
       needs to be out of step with the others gets its own element. They share
       one file, so it downloads once. -->
  <video id="v0" src="/assets/unicorn-diva-green.mp4" loop muted playsinline preload="auto"></video>
  <video id="v1" src="/assets/unicorn-diva-green.mp4" loop muted playsinline preload="auto"></video>
  <video id="v2" src="/assets/unicorn-diva-green.mp4" loop muted playsinline preload="auto"></video>

  <div class="bar">
    <button class="b hero" id="b-show">▶ Play the show</button>
    <button class="b" id="b-song">🎤 Gangnam Style</button>
    <button class="b" id="b-ours">🔊 Our own track</button>
    <div class="note" id="note">She dances alone, then the others jump in on the beat.</div>
  </div>

  <script>
  (() => {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const cv = $('stage'), ctx = cv.getContext('2d');

    /* ═════════ THE MUSIC ═════════ */
    const YT_ID = '9bZkp7q19f0', YT_BPM = 132;
    let yt = null, ytReady = false, ytOn = false;
    const ytTime = () => {
      if (!ytOn || !yt || !yt.getCurrentTime) return null;
      try { return yt.getPlayerState() === 1 ? yt.getCurrentTime() : null; } catch (e) { return null; }
    };
    (function boot() {
      const make = () => {
        yt = new YT.Player('yt', {
          videoId: YT_ID, width: 320, height: 180,
          host: 'https://www.youtube-nocookie.com',
          playerVars: { autoplay: 0, controls: 1, rel: 0, playsinline: 1 },
          events: {
            onReady: () => { ytReady = true; },
            onError: () => { track.play().catch(() => {}); $('note').textContent = 'YouTube refused — playing our own track.'; },
            onStateChange: (ev) => { if (ev.data === 0 && ytOn) { try { ev.target.seekTo(0); ev.target.playVideo(); } catch (e) {} } },
          },
        });
      };
      if (window.YT && window.YT.Player) return make();
      window.onYouTubeIframeAPIReady = make;
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    })();
    const OUR_BPM = 131, OUR_OFFSET = 0.29;
    const track = new Audio('/assets/party-132.mp3');
    track.loop = true; track.volume = 0.8;
    const trackTime = () => (!track.paused && !track.ended ? track.currentTime - OUR_OFFSET : null);
    const beatNow = () => {
      const y = ytTime();
      if (y != null) return (y * YT_BPM) / 60;
      const o = trackTime();
      if (o != null) return (o * OUR_BPM) / 60;
      return (performance.now() / 1000 * 132) / 60;
    };

    /* ═════════ CUTTING THE GREEN OUT, IN THE BROWSER ═════════
       Transparent video codecs are a minefield — VP9 and VP8 alpha both came
       back without an alpha channel from this encoder, which would have put a
       black box behind her. Keying here instead is bulletproof: the frame is
       drawn to a scratch canvas, every green pixel has its alpha set to zero,
       and the result is composited onto the scene. It also means the threshold
       is a number I can tune rather than something baked into a file. */
    const KEY = { r: 95, g: 211, b: 61 };          // the green she was shot against
    const scratch = document.createElement('canvas');
    const sctx = scratch.getContext('2d', { willReadFrequently: true });
    function keyFrame(video) {
      const w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) return null;
      if (scratch.width !== w) { scratch.width = w; scratch.height = h; }
      sctx.clearRect(0, 0, w, h);
      sctx.drawImage(video, 0, 0);
      const img = sctx.getImageData(0, 0, w, h), d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        /* GREENNESS, not brightness. The old test (g > 1.35*r and 1.35*b) missed
           the green that sits in her own drop shadow — darker, less saturated —
           and left a pale pool round every dancer's feet. How far green leads
           the other two channels is what a screen is, bright or dark. */
        const lead = g - Math.max(r, b);
        if (lead > 38) { d[i + 3] = 0; continue; }              // screen: gone
        if (lead > 10) {                                        // fringe: fade out and despill
          d[i + 3] = Math.round(d[i + 3] * (1 - (lead - 10) / 28));
          d[i + 1] = Math.max(r, b);
        }
      }
      sctx.putImageData(img, 0, 0);
      return scratch;
    }

    /* ═════════ THE CAST ═════════
       Five marks on the floor. The star is centre and slightly larger; the rest
       fan out behind her and arrive later, each on its own beat. */
    const MARKS = [
      { x: 0.50, y: 0.80, s: 1.00, v: 0, at: 0,  flip: false },   // the star
      { x: 0.24, y: 0.74, s: 0.78, v: 1, at: 8,  flip: true  },
      { x: 0.76, y: 0.74, s: 0.78, v: 2, at: 12, flip: false },
      { x: 0.10, y: 0.68, s: 0.62, v: 1, at: 16, flip: false },
      { x: 0.90, y: 0.68, s: 0.62, v: 2, at: 20, flip: true  },
    ];
    const NEON = ['#ff2d95', '#ff8a00', '#ffd400', '#6cff5a', '#00f0ff', '#a855f7'];

    let showStart = null;
    function resize() {
      cv.width = innerWidth * Math.min(2, devicePixelRatio || 1);
      cv.height = innerHeight * Math.min(2, devicePixelRatio || 1);
      cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    }
    addEventListener('resize', resize); resize();

    function frame() {
      const W = cv.width, H = cv.height;
      const beat = beatNow();
      const pulse = Math.pow(1 - (((beat % 1) + 1) % 1), 3);   // 1 on the beat, fading to 0
      const showBeat = showStart == null ? -1 : beat - showStart;

      // ── the room
      ctx.fillStyle = '#06060d';
      ctx.fillRect(0, 0, W, H);

      // floor
      const horizon = H * 0.58;
      const g = ctx.createLinearGradient(0, horizon, 0, H);
      g.addColorStop(0, '#140f22'); g.addColorStop(1, '#05050b');
      ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);

      // beams from the ball, turning and pulsing
      const bx = W / 2, by = H * 0.16, R = Math.max(W, H) * 1.3;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 7; i++) {
        const a = beat * 0.35 + (i / 7) * Math.PI * 2;
        const col = NEON[i % NEON.length];
        const gg = ctx.createLinearGradient(bx, by, bx + Math.cos(a) * R, by + Math.sin(a) * R);
        gg.addColorStop(0, col + '44'); gg.addColorStop(0.5, col + '11'); gg.addColorStop(1, '#00000000');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.arc(bx, by, R, a - 0.05 - pulse * 0.02, a + 0.05 + pulse * 0.02);
        ctx.closePath(); ctx.fill();
      }
      // sweeping floor spots
      for (let i = 0; i < 6; i++) {
        const a = beat * 0.5 * (i % 2 ? 1 : -1) + i;
        const sx = bx + Math.cos(a) * W * 0.42, sy = horizon + H * 0.18 + Math.sin(a * 1.4) * H * 0.1;
        const rad = (60 + 40 * Math.abs(Math.sin(a))) * (W / 1200);
        const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
        sg.addColorStop(0, NEON[i % NEON.length] + '55'); sg.addColorStop(1, '#00000000');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, rad, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      // the ball itself
      const bR = Math.min(W, H) * 0.055;
      ctx.save();
      ctx.strokeStyle = 'rgba(150,150,165,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, by - bR); ctx.stroke();
      const bg = ctx.createRadialGradient(bx - bR * 0.35, by - bR * 0.4, bR * 0.1, bx, by, bR);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.55, '#b9c4d6'); bg.addColorStop(1, '#4d5464');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, bR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(20,24,34,.35)'; ctx.lineWidth = 1.2;
      for (let r = -3; r <= 3; r++) {
        const yy = by + (r / 3.4) * bR, rr = Math.sqrt(Math.max(0, bR * bR - (yy - by) * (yy - by)));
        ctx.beginPath(); ctx.moveTo(bx - rr, yy); ctx.lineTo(bx + rr, yy); ctx.stroke();
      }
      for (let c = 0; c < 7; c++) {
        const ph = beat * 0.6 + (c / 7) * Math.PI * 2, sx = Math.cos(ph);
        ctx.beginPath(); ctx.ellipse(bx, by, Math.abs(sx) * bR, bR, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'lighter';
      const hg = ctx.createRadialGradient(bx, by, 0, bx, by, bR * (2.6 + pulse));
      hg.addColorStop(0, 'rgba(255,255,255,.30)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(bx, by, bR * (2.6 + pulse), 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // ── the dancers
      MARKS.forEach((m) => {
        if (showBeat >= 0 && showBeat < m.at) return;          // not on yet
        const v = $('v' + m.v);
        const keyed = keyFrame(v);
        if (!keyed) return;
        const size = Math.min(W, H) * 0.62 * m.s;
        const x = W * m.x, y = H * m.y;

        // the jump-on: drop from above and squash on landing
        let jump = 0, squash = 1;
        if (showBeat >= 0 && m.at > 0) {
          const since = showBeat - m.at;
          if (since < 1) { jump = (1 - since) * (1 - since) * size * 1.6; squash = 1; }
          else if (since < 1.25) { const k = (since - 1) / 0.25; squash = 1 - Math.sin(k * Math.PI) * 0.14; }
        }
        // everyone lifts a little on the beat, so the room moves together
        const lift = pulse * size * 0.03;

        // a pool of light under each dancer
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const pg = ctx.createRadialGradient(x, y, 0, x, y, size * 0.42);
        pg.addColorStop(0, 'rgba(255,255,255,.16)'); pg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.ellipse(x, y, size * 0.42, size * 0.12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(x, y - jump - lift);
        if (m.flip) ctx.scale(-1, 1);
        ctx.drawImage(keyed, -size / 2, -size * squash, size, size * squash);
        ctx.restore();
      });

      // ── the caption
      if (showBeat >= 0 && showBeat < 8) {
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.font = '600 ' + Math.round(W * 0.016) + 'px Space Grotesk, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('…wait for it', W / 2, H * 0.30);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ═════════ CONTROLS ═════════ */
    function startVideos() {
      // stagger them so the back row is not a mirror of the star
      [['v0', 0], ['v1', 2.7], ['v2', 5.3]].forEach(([id, off]) => {
        const v = $(id);
        v.currentTime = off;
        v.play().catch(() => {});
      });
    }
    $('b-show').addEventListener('click', () => {
      startVideos();
      showStart = beatNow();
      $('note').textContent = 'She dances alone for two bars, then they drop in one at a time.';
    });
    $('b-song').addEventListener('click', (e) => {
      if (ytOn) { ytOn = false; try { yt.pauseVideo(); } catch (x) {} e.target.classList.remove('on'); return; }
      if (!ytReady) { $('note').textContent = 'The player is still loading — press again in a second.'; return; }
      track.pause();
      try { yt.unMute(); yt.setVolume(100); yt.playVideo(); } catch (x) {}
      ytOn = true; e.target.classList.add('on');
      startVideos();
      if (showStart == null) showStart = beatNow();
    });
    $('b-ours').addEventListener('click', (e) => {
      if (!track.paused) { track.pause(); e.target.classList.remove('on'); return; }
      if (ytOn) { try { yt.pauseVideo(); } catch (x) {} ytOn = false; $('b-song').classList.remove('on'); }
      track.play().then(() => {
        e.target.classList.add('on');
        startVideos();
        if (showStart == null) showStart = beatNow();
      }).catch(() => { $('note').textContent = 'The browser blocked the audio — try a normal browser window.'; });
    });
  })();
  </script>
</body>
</html>
