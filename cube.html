<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuboid</title>
<script src="/q-auth.js"></script>
<!--
  CUBOID — the glass cuboid OS, dark scene.

  The stage below is option 1j from the design handoff
  (design_handoff_glass_cuboid), lifted verbatim: it is plain HTML with inline
  styles, no template syntax, and the handoff states its colours, sizes,
  timings and easing are final. Do not "tidy" those inline styles — every
  number in them is the design.

  ⚠️ transform-style: preserve-3d must survive to the faces. Putting a wrapper
  with overflow, filter or opacity between the stage and the cube flattens the
  whole thing into a rectangle. The handoff calls this out and it is easy to do
  by accident.

  This page is dark on purpose (Sarah, 22 Aug: "on a dark page"). It is the one
  dark surface in Q — the rest of the app stays light neumorphic.
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: radial-gradient(130% 90% at 50% -10%, #121722 0%, #080b12 52%, #04060a 100%);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e8ecf4;
  }
  .wrap {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 18px 60px; gap: 26px;
  }
  header.page {
    width: 100%; max-width: 620px;
    display: flex; align-items: baseline; gap: 9px;
  }
  .logo { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; color: #f2f5fa; }
  .logo .dot { color: #e91e63; }
  .name { font-size: 13px; color: rgba(232,236,244,0.42); letter-spacing: 0.3px; }
  a.back {
    margin-left: auto; font-size: 13px; text-decoration: none;
    color: rgba(232,236,244,0.55);
    padding: 9px 14px; border-radius: 11px;
    background: rgba(255,255,255,0.04);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 10px rgba(0,0,0,0.4);
  }
  a.back:hover { color: #f2f5fa; }

  @keyframes barPulse { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
  @keyframes holoFloat { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
  @keyframes holoFlicker { 0%, 100% { opacity: .95; } 42% { opacity: .78; } 47% { opacity: 1; } 71% { opacity: .84; } }
  @keyframes iconGlow { 0%, 100% { filter: saturate(1.15) brightness(1); } 50% { filter: saturate(1.4) brightness(1.22); } }
  @keyframes rainFall { 0% { transform: translateY(-40px); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateY(300px); opacity: 0; } }
  @keyframes lightning { 0%, 86%, 100% { opacity: 0; } 87% { opacity: .85; } 88.5% { opacity: .1; } 90% { opacity: .7; } 91.5% { opacity: 0; } }
  @keyframes lightning2 { 0%, 44%, 100% { opacity: 0; } 45% { opacity: .6; } 46.5% { opacity: .05; } 47.5% { opacity: .4; } 49% { opacity: 0; } }
  @keyframes boltStrike { 0%, 85%, 100% { opacity: 0; } 86.5% { opacity: 1; } 88% { opacity: .15; } 89.5% { opacity: .9; } 91% { opacity: 0; } }
  @keyframes boltStrike2 { 0%, 43%, 100% { opacity: 0; } 44.5% { opacity: .95; } 46% { opacity: .1; } 47% { opacity: .7; } 48.5% { opacity: 0; } }
  @keyframes chessMovePct { 0%, 42% { transform: translate(0, 0); } 50%, 92% { transform: translate(200%, -200%); } 100% { transform: translate(0, 0); } }
  @keyframes cubeSpin { 0% { transform: rotateX(-14deg) rotateY(-30deg); } 50% { transform: rotateX(-8deg) rotateY(-8deg); } 100% { transform: rotateX(-14deg) rotateY(-30deg); } }

  /* The handoff asks for this explicitly: freeze the motion, keep the
     composition. A storm inside a spinning cube is exactly what someone with
     vestibular trouble has switched motion off to avoid. */
  /* Snow had no keyframe of its own — it borrowed rainFall, and the rain
     detector finds drops by looking for "rainFall" in the style, so it hid
     every flake the moment the weather was not rain. Its own animation, and
     the collision cannot happen again. */
  @keyframes snowFall { 0% { transform: translateY(-30px); opacity: 0; } 8% { opacity: .95; } 88% { opacity: .95; } 100% { transform: translateY(300px); opacity: 0; } }
  @keyframes snowDrift { 0%, 100% { transform: translateX(-7px); } 50% { transform: translateX(7px); } }
  @keyframes twistSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
  @keyframes twistSway { 0%, 100% { transform: translateX(-9px) rotate(-2.5deg); } 50% { transform: translateX(9px) rotate(2.5deg); } }
  @keyframes twistDebris { 0% { transform: rotate(0deg) translateX(var(--r, 40px)) rotate(0deg); } 100% { transform: rotate(360deg) translateX(var(--r, 40px)) rotate(-360deg); } }

  @media (prefers-reduced-motion: reduce) {
    [data-cuboid-stage] *,
    [data-cuboid-stage] {
      animation: none !important;
    }
  }

  /* Choosing what goes on each side. In the page, not floating over it —
     nothing here dims or covers the cube. */
  #face-panel { display: none; width: min(820px, calc(100% - 32px)); margin: 0 auto; }
  #face-panel.open { display: block; }
  #face-picker { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 16px;
                 background: rgba(255,255,255,0.035); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 12px 30px rgba(0,0,0,0.45); }
  .fp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fp-face { flex: 0 0 66px; font-size: 12px; letter-spacing: .06em; color: rgba(232,236,244,0.5); }
  .fp-opt { font-family: inherit; font-size: 12.5px; cursor: pointer; border: none;
            color: rgba(232,236,244,0.72); background: rgba(255,255,255,0.05);
            padding: 9px 13px; border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
  .fp-opt:hover { color: #fff; }
  /* Chosen shows with the accent and a dot — never by sinking the button. */
  .fp-opt.on { color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 14px rgba(0,0,0,0.4); }
  .fp-opt.on::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                       background: #e91e63; margin-right: 8px; vertical-align: middle; }

  @media (max-width: 620px) {
    /* The stage is a fixed 560x620 by design — scale the whole thing rather
       than reflowing it, because percentage sizing inside a rotated face
       spills (the handoff hit this during design). */
    .scaler { transform: scale(var(--s, 1)); transform-origin: top center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <span class="logo">Q<span class="dot">.</span></span>
    <span class="name">Cuboid</span>
    <button id="face-toggle" class="back" type="button" style="margin-left:auto;cursor:pointer;font-family:inherit;border:none;">Sides</button>
    <a class="back" href="/tools" style="margin-left:10px;">← tools</a>
  </header>

  <div id="face-panel"><div id="face-picker"></div></div>
  <div class="scaler">
      <div style="position: relative; width: 560px; height: 620px; border-radius: 20px; background: radial-gradient(120% 100% at 50% 0%, #171d2c 0%, #0b0f18 58%, #05070c 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 34px 70px rgba(20,28,48,.55); overflow: hidden; perspective: 1500px; perspective-origin: 50% 46%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;" data-cuboid-stage="1">

        <div style="position: absolute; width: 250px; height: 250px; left: 30px; bottom: 40px; border-radius: 50%; background: radial-gradient(circle, rgba(60,190,255,.42), transparent 68%); filter: blur(18px);"></div>
        <div style="position: absolute; width: 210px; height: 210px; right: 24px; top: 50px; border-radius: 50%; background: radial-gradient(circle, rgba(255,90,200,.32), transparent 68%); filter: blur(20px);"></div>

        <div id="cuboid-os" style="width: 300px; height: 300px; position: relative; transform-style: preserve-3d; animation: cubeSpin 18s ease-in-out infinite;">

          <div data-face="left" style="position: absolute; inset: 0; transform: rotateY(-90deg) translateZ(150px); border-radius: 4px; backdrop-filter: saturate(1.6) brightness(1.06); background: linear-gradient(96deg, rgba(140,225,255,.34) 0%, rgba(255,255,255,.02) 26%, rgba(255,255,255,.02) 74%, rgba(190,235,255,.28) 100%); box-shadow: inset 0 0 0 1px rgba(180,230,255,.5), inset 0 1px 0 rgba(225,248,255,.6), inset 4px 0 20px rgba(110,210,255,.34); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .2em; color: rgba(168,240,255,.8);">APPS</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .12em; color: rgba(168,240,255,.55);" id="cb-apps-count"></div>
            </div>
            <div id="cb-tiles" style="display: grid; grid-template-columns: repeat(4, 52px); grid-auto-rows: 52px; gap: 10px; justify-content: center; align-content: center; filter: saturate(1.2) brightness(1.08);">
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(67,245,255,.62), rgba(13,140,255,.42)); box-shadow: inset 0 0 0 1px rgba(190,250,255,.9), 0 0 10px rgba(13,140,255,.42);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(255,106,213,.6), rgba(200,30,200,.4)); box-shadow: inset 0 0 0 1px rgba(255,205,245,.9), 0 0 10px rgba(200,30,200,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(183,140,255,.6), rgba(106,47,245,.4)); box-shadow: inset 0 0 0 1px rgba(220,200,255,.9), 0 0 10px rgba(106,47,245,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(100,255,180,.6), rgba(0,196,122,.4)); box-shadow: inset 0 0 0 1px rgba(195,255,228,.9), 0 0 10px rgba(0,196,122,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(255,209,102,.6), rgba(255,138,31,.4)); box-shadow: inset 0 0 0 1px rgba(255,238,200,.9), 0 0 10px rgba(255,138,31,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(255,143,122,.6), rgba(240,52,63,.4)); box-shadow: inset 0 0 0 1px rgba(255,210,202,.9), 0 0 10px rgba(240,52,63,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(125,255,240,.6), rgba(18,183,201,.4)); box-shadow: inset 0 0 0 1px rgba(200,255,250,.9), 0 0 10px rgba(18,183,201,.4);"></div>
                <div style="border-radius: 10px; background: linear-gradient(150deg, rgba(255,224,102,.6), rgba(255,179,0,.4)); box-shadow: inset 0 0 0 1px rgba(255,245,205,.9), 0 0 10px rgba(255,179,0,.4);"></div>
            </div>
          </div>

          <div data-face="right" style="position: absolute; inset: 0; transform: rotateY(90deg) translateZ(150px); border-radius: 4px; backdrop-filter: saturate(1.6) brightness(1.06); background: linear-gradient(96deg, rgba(255,175,240,.32) 0%, rgba(255,255,255,.02) 30%, rgba(255,255,255,.02) 74%, rgba(200,190,255,.26) 100%); box-shadow: inset 0 0 0 1px rgba(235,200,255,.48), inset 0 1px 0 rgba(250,235,255,.55), inset -4px 0 20px rgba(255,150,235,.3); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .2em; color: rgba(255,205,245,.85);">TODAY</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: rgba(255,205,245,.55);" id="cb-day-count"></div>
            </div>
            <div style="border-radius: 6px; height: 96px; background: linear-gradient(160deg, rgba(255,175,240,.3), rgba(120,60,140,.35)); box-shadow: inset 0 0 0 1px rgba(255,205,245,.55); display: flex; align-items: center; justify-content: center;">
              <div id="cb-event-play" style="width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 15px solid rgba(255,235,250,.95); margin-left: 4px;"></div>
            </div>
            <div style="height: 3px; border-radius: 999px; background: rgba(255,205,245,.22);">
              <div id="cb-daybar" style="width: 0%; height: 3px; border-radius: 999px; background: rgba(255,120,215,.95);"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div style="display: flex; gap: 8px; align-items: center;">
                <div style="width: 42px; height: 24px; flex: none; border-radius: 3px; background: rgba(255,175,240,.28); box-shadow: inset 0 0 0 1px rgba(255,205,245,.45);"></div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                  <div style="height: 4px; border-radius: 999px; background: rgba(255,215,248,.55);"></div>
                  <div style="height: 4px; width: 62%; border-radius: 999px; background: rgba(255,215,248,.3);"></div>
                </div>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <div style="width: 42px; height: 24px; flex: none; border-radius: 3px; background: rgba(255,175,240,.2); box-shadow: inset 0 0 0 1px rgba(255,205,245,.35);"></div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                  <div style="height: 4px; border-radius: 999px; background: rgba(255,215,248,.4);"></div>
                  <div style="height: 4px; width: 48%; border-radius: 999px; background: rgba(255,215,248,.22);"></div>
                </div>
              </div>
            </div>
          </div>

          <div data-face="top" style="position: absolute; inset: 0; transform: rotateX(90deg) translateZ(150px); border-radius: 4px; overflow: hidden; backdrop-filter: saturate(1.6) brightness(1.14); background: linear-gradient(160deg, rgba(255,255,255,.32) 0%, rgba(225,248,255,.1) 45%, rgba(160,215,255,.18) 100%); box-shadow: inset 0 0 0 1px rgba(190,235,255,.6), inset 0 1px 0 rgba(235,250,255,.7), 0 0 80px rgba(190,235,255,.4); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
            <div style="position: relative; width: 100%; height: 100%; background-image: repeating-conic-gradient(rgba(45,125,170,.34) 0% 25%, rgba(228,250,255,.24) 0% 50%); background-size: 67px 67px; box-shadow: inset 0 0 0 1px rgba(45,125,170,.5);">
              <div style="position: absolute; left: 0.00%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♜</div>
              <div style="position: absolute; left: 12.50%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♞</div>
              <div style="position: absolute; left: 37.50%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♛</div>
              <div style="position: absolute; left: 50.00%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♚</div>
              <div style="position: absolute; left: 62.50%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♝</div>
              <div style="position: absolute; left: 87.50%; top: 0.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♜</div>
              <div style="position: absolute; left: 0.00%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 12.50%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 37.50%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 62.50%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 75.00%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 87.50%; top: 12.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(18,66,100,.95);">♟</div>
              <div style="position: absolute; left: 12.50%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 25.00%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 50.00%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 62.50%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 75.00%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 87.50%; top: 75.00%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♙</div>
              <div style="position: absolute; left: 0.00%; top: 87.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♖</div>
              <div style="position: absolute; left: 37.50%; top: 87.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♕</div>
              <div style="position: absolute; left: 50.00%; top: 87.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♔</div>
              <div style="position: absolute; left: 25.00%; top: 87.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♗</div>
              <div style="position: absolute; left: 87.50%; top: 87.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95);">♖</div>
              <div style="position: absolute; left: 25.00%; top: 62.50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: rgba(228,251,255,.95); animation: chessMovePct 9s ease-in-out infinite;">♘</div>
            </div>
          </div>

          <div data-face="bottom" style="position: absolute; inset: 0; transform: rotateX(-90deg) translateZ(150px); border-radius: 4px; backdrop-filter: saturate(1.5); background: linear-gradient(160deg, rgba(140,205,250,.14), rgba(40,70,120,.14)); box-shadow: inset 0 0 0 1px rgba(175,220,255,.42), inset 0 1px 0 rgba(225,245,255,.5), inset 0 -34px 54px rgba(255,255,255,.1); padding: 24px; box-sizing: border-box; display: flex; align-items: flex-end;">
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .2em; color: rgba(190,230,255,.5);">BASE / IDLE</div>
          </div>

          <div data-face="back" style="position: absolute; inset: 0; transform: translateZ(-150px) rotateY(180deg); border-radius: 4px; backdrop-filter: saturate(1.4) brightness(1.04); background: linear-gradient(160deg, rgba(180,235,255,.08), rgba(110,165,255,.02) 55%, rgba(210,150,255,.08)); box-shadow: inset 0 0 0 1px rgba(175,220,255,.4), inset 0 1px 0 rgba(225,245,255,.5), inset 0 34px 54px rgba(255,255,255,.1); backface-visibility: hidden;"></div>


          <div style="position: absolute; inset: 0; transform: translateZ(0px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 74px; box-sizing: border-box; pointer-events: none;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; animation: holoFloat 6s ease-in-out infinite;">
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: .01em; color: #c8f7ff; text-shadow: 0 0 14px rgba(120,225,255,.95), 0 0 44px rgba(60,180,255,.7); animation: holoFlicker 3.2s ease-in-out infinite;" id="cb-clock">21:04</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .32em; white-space: nowrap; color: rgba(200,247,255,.9); text-shadow: 0 0 12px rgba(120,225,255,.8);" id="cb-date">FRI 21 AUG</div>
              <div style="display: flex; flex-direction: column; gap: 7px; padding-top: 14px;" id="cb-todos">

<script>
(function () {
  'use strict';

  // Drag to turn. Straight from the handoff's wireDrag: auto-spin is cancelled
  // on the first grab and deliberately does not resume — once you have taken
  // hold of it, it stays where you put it.
  var cube = document.getElementById('cuboid-os');
  var stage = cube && cube.closest('[data-cuboid-stage]');
  if (cube && stage) {
    var rx = -14, ry = -30, dragging = false, px = 0, py = 0;
    var apply = function () {
      cube.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    };
    stage.addEventListener('pointerdown', function (e) {
      dragging = true; px = e.clientX; py = e.clientY; window.__cbDragged = false;
      cube.style.animation = 'none';
      stage.style.cursor = 'grabbing';
      apply();
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      if (Math.abs(e.clientX - px) > 3 || Math.abs(e.clientY - py) > 3) window.__cbDragged = true;
      ry += (e.clientX - px) * 0.5;
      rx = Math.max(-70, Math.min(70, rx - (e.clientY - py) * 0.4));
      px = e.clientX; py = e.clientY;
      apply();
    });
    var stop = function () { dragging = false; stage.style.cursor = 'grab'; };
    stage.addEventListener('pointerup', stop);
    stage.addEventListener('pointercancel', stop);
  }

  // ── REAL DATA ────────────────────────────────────────────────
  // Everything the design shipped on these faces was invented — a frozen
  // clock, yesterday's date, the designer's own to-dos, a song that does not
  // exist. On a live page that is furniture pretending to be information.
  // These read the SAME endpoints the Life page reads. Where there is nothing,
  // they say nothing: no filler rows, no placeholder counts.
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  function tick() {
    var now = new Date();
    var c = document.getElementById('cb-clock');
    var d = document.getElementById('cb-date');
    if (c) c.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if (d) d.textContent = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
    // The bar on the right face is how far through the working day it is —
    // 07:00 to 21:00. A real fraction, not a decorative 62%.
    var bar = document.getElementById('cb-daybar');
    if (bar) {
      var mins = now.getHours() * 60 + now.getMinutes();
      var pct = Math.max(0, Math.min(100, (mins - 420) / (21 * 60 - 420) * 100));
      bar.style.width = pct.toFixed(1) + '%';
    }
  }
  tick();
  setInterval(tick, 1000 * 20);

  // The eight tiles are the eight places you actually go. Colours are the
  // design's; only the destination and the label are new.
  var TILES = [
    { href: '/chat',     label: 'Q' },
    { href: '/life',     label: 'DAY' },
    { href: '/writer',   label: 'WRITE' },
    { href: '/threads',  label: 'CASES' },
    { href: '/trips',    label: 'TRIPS' },
    { href: '/finance',  label: 'MONEY' },
    { href: '/plotter',  label: 'FORMS' },
    { href: '/tools',    label: 'ALL' }
  ];
  var tiles = document.getElementById('cb-tiles');
  if (tiles) {
    var cells = Array.prototype.slice.call(tiles.children);
    cells.forEach(function (cell, i) {
      var t = TILES[i];
      if (!t) return;
      var a = document.createElement('a');
      a.href = t.href;
      a.title = t.label;
      a.style.cssText = cell.getAttribute('style')
        + ';display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;text-decoration:none;';
      a.innerHTML = '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:7px;letter-spacing:.1em;'
        + 'color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);">' + t.label + '</span>';
      // A drag across the cube must not also count as a tap on a tile.
      a.addEventListener('click', function (e) { if (window.__cbDragged) e.preventDefault(); });
      cell.parentNode.replaceChild(a, cell);
    });
  }

  function get(url) {
    return fetch(url, { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  // TASKS — the hologram's three rows, the apps count, and the strip on the
  // front face. Done ones are struck through, exactly as the design drew them.
  get('/life/tasks').then(function (tasks) {
    if (!Array.isArray(tasks)) return;
    var open = tasks.filter(function (t) { return !t.done; });
    var todayStr = new Date().toISOString().slice(0, 10);
    var dueToday = open.filter(function (t) { return t.due && t.due <= todayStr; });

    var count = document.getElementById('cb-apps-count');
    if (count) count.textContent = open.length ? (open.length + ' TO DO') : 'ALL DONE';

    var box = document.getElementById('cb-todos');
    if (box) {
      // Today's first, then whatever is next. Three fit the hologram.
      var show = dueToday.concat(open.filter(function (t) { return dueToday.indexOf(t) < 0; })).slice(0, 3);
      if (!show.length) {
        box.innerHTML = '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;'
          + 'color:rgba(200,247,255,.5);text-shadow:0 0 10px rgba(120,225,255,.6);">nothing on the list</div>';
      } else {
        box.innerHTML = show.map(function (t) {
          var title = String(t.title || '');
          // 20 is the design's own longest row ("wire the drag handle"). Real task
          // titles are longer than the designer's, and at 25 they ran past the
          // cube edge — the hologram floats at mid-depth so there is nothing to
          // clip them.
          if (title.length > 20) title = title.slice(0, 19) + '…';
          return '<div style="display: flex; align-items: center; gap: 9px;">'
            + '<div style="width: 9px; height: 9px; flex: none; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(180,240,255,.85);'
            + (t.done ? ' background: rgba(120,225,255,.75);' : '') + '"></div>'
            + '<div style="font-family: \'IBM Plex Mono\', monospace; font-size: 10.5px; white-space: nowrap;'
            + ' color: rgba(' + (t.done ? '200,247,255,.5' : '210,250,255,.92') + ');'
            + (t.done ? ' text-decoration: line-through;' : '')
            + ' text-shadow: 0 0 10px rgba(120,225,255,.6);">' + esc(title) + '</div></div>';
        }).join('');
      }
    }

    var nextTitle = document.getElementById('cb-next-title');
    var nextMeta = document.getElementById('cb-next-meta');
    if (nextTitle) {
      var n = dueToday[0] || open[0];
      var s = n ? String(n.title || '') : 'nothing waiting';
      nextTitle.textContent = s.length > 22 ? s.slice(0, 21) + '…' : s;
    }
    if (nextMeta) {
      var done = tasks.filter(function (t) { return t.done; }).length;
      nextMeta.textContent = tasks.length ? (done + ' / ' + tasks.length) : '';
    }
  });

  // EVENTS — the right face. The panel that was a video preview is the next
  // thing in the diary; the rows under it are what follows.
  var today = new Date().toISOString().slice(0, 10);
  get('/life/events?from=' + today + '&to=' + today).then(function (events) {
    if (!Array.isArray(events)) return;
    var sorted = events.slice().sort(function (a, b) {
      return String(a.time || '99:99').localeCompare(String(b.time || '99:99'));
    });
    var dayCount = document.getElementById('cb-day-count');
    if (dayCount) dayCount.textContent = sorted.length ? (sorted.length + ' ON') : 'CLEAR';

    var play = document.getElementById('cb-event-play');
    if (play && sorted.length) {
      var e0 = sorted[0];
      var t0 = String(e0.title || '');
      play.style.cssText = 'display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:0 12px;';
      play.innerHTML =
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:15px;color:rgba(255,235,250,.95);">'
        + esc(e0.time || '') + '</div>'
        + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:9px;line-height:1.35;color:rgba(255,215,248,.8);">'
        + esc(t0.length > 34 ? t0.slice(0, 33) + '…' : t0) + '</div>';
    }
  });


  // ── WHAT GOES ON EACH SIDE ──────────────────────────────────────
  // The six faces are addressable, and what sits on one is a choice. The
  // design's own contents are captured at boot as each face's 'designed'
  // panel, so nothing had to be retyped and nothing is lost — pick something
  // else and you can always put it back.
  var CUBE_FACES = ['front', 'left', 'right', 'top', 'bottom', 'back'];
  var FACE_NAME = { front: 'Front', left: 'Left', right: 'Right', top: 'Top', bottom: 'Bottom', back: 'Back' };
  var designed = {};
  CUBE_FACES.forEach(function (f) {
    var el = document.querySelector('#cuboid-os [data-face="' + f + '"]');
    designed[f] = el ? el.innerHTML : '';
  });

  // The panels you can choose from. Each is { name, html } or { name, mount }.
  // The five that came with the design are here by default; the rest is the
  // list Sarah is writing.
  var PANELS = {
    designed: { name: 'as designed', html: function (face) { return designed[face]; } },
    clear:    { name: 'clear glass', html: function () { return ''; } }
  };

  function faceChoice() {
    var c;
    try { c = JSON.parse(localStorage.getItem('q-cube-faces') || '{}'); }
    catch (e) { c = {}; }
    // Anyone who already had the drawing on the front had it covering the
    // clock. Move it to the back rather than quietly dropping it.
    if (c.front === 'draw') {
      c.front = 'designed';
      if (!c.back || c.back === 'designed') c.back = 'draw';
      try { localStorage.setItem('q-cube-faces', JSON.stringify(c)); } catch (e) {}
    }
    return c;
  }
  function setFace(face, panelId) {
    var c = faceChoice();
    c[face] = panelId;
    try { localStorage.setItem('q-cube-faces', JSON.stringify(c)); } catch (e) {}
    paintFace(face);
    paintPicker();
  }
  function paintFace(face) {
    var el = document.querySelector('#cuboid-os [data-face="' + face + '"]');
    if (!el) return;
    var id = faceChoice()[face] || 'designed';
    var p = PANELS[id] || PANELS.designed;
    if (typeof p.mount === 'function') { el.innerHTML = ''; p.mount(el, face); }
    else { el.innerHTML = p.html(face); }
  }
  function paintAllFaces() { CUBE_FACES.forEach(paintFace); }

  // Which panels a given side may carry. The front is where the clock reads
  // through the glass, so the drawing is not offered there — it would hide the
  // very thing the cube is for.
  var NOT_ON = { front: ['draw'] };
  function panelsFor(face) {
    var block = NOT_ON[face] || [];
    return Object.keys(PANELS).filter(function (id) { return block.indexOf(id) < 0; });
  }

  function paintPicker() {
    var box = document.getElementById('face-picker');
    if (!box) return;
    var chosen = faceChoice();
    var w = weatherNow();
    box.innerHTML = '<div class="fp-row"><span class="fp-face">Weather</span>'
      + WEATHER.map(function (id) {
          return '<button class="fp-opt' + (w === id ? ' on' : '') + '" data-weather="' + id + '">' + WEATHER_NAME[id] + '</button>';
        }).join('')
      + '</div>' + CUBE_FACES.map(function (f) {
      return '<div class="fp-row"><span class="fp-face">' + FACE_NAME[f] + '</span>'
        + panelsFor(f).map(function (id) {
            var on = (chosen[f] || 'designed') === id;
            return '<button class="fp-opt' + (on ? ' on' : '') + '" data-pick-face="' + f + '" data-panel="' + id + '">'
              + PANELS[id].name + '</button>';
          }).join('')
        + '</div>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.fp-opt') : null;
    if (b && b.getAttribute('data-weather')) { setWeather(b.getAttribute('data-weather')); return; }
    if (b) { setFace(b.getAttribute('data-pick-face'), b.getAttribute('data-panel')); return; }
    var t = e.target.closest ? e.target.closest('#face-toggle') : null;
    if (t) {
      var p = document.getElementById('face-panel');
      p.classList.toggle('open');
      t.textContent = p.classList.contains('open') ? 'Done' : 'Sides';
    }
  });


  // ── WEATHER INSIDE THE CUBE ─────────────────────────────────────
  // The design shipped a permanent storm. It is a setting now, and it is
  // SHARED: the flower side reads it, which is how watering works — rain, then
  // sun, and it grows.
  var WEATHER = ['clear', 'sun', 'rain', 'storm', 'twister', 'snow'];
  var WEATHER_NAME = { clear: 'clear', sun: 'sun', rain: 'rain', storm: 'storm', twister: 'twister', snow: 'snow' };

  function weatherNow() {
    try { return localStorage.getItem('q-cube-weather') || 'storm'; } catch (e) { return 'storm'; }
  }
  function setWeather(w) {
    if (WEATHER.indexOf(w) < 0) return;
    try { localStorage.setItem('q-cube-weather', w); } catch (e) {}
    applyWeather();
    paintPicker();
    // Everything that cares — the flower, for one — listens for this.
    document.dispatchEvent(new CustomEvent('cube:weather', { detail: { weather: w } }));
  }

  // The rain layers and the bolts are the design's own elements; they are found
  // by what they do rather than tagged, so nothing in the markup had to change.
  function weatherParts() {
    var cube = document.getElementById('cuboid-os');
    var drops = [], bolts = [];
    if (!cube) return { drops: drops, bolts: bolts };
    Array.prototype.forEach.call(cube.querySelectorAll('div'), function (d) {
      // Never claim anything the weather engine itself made — that is exactly
      // how the snow came to be switched off by the rain.
      if (d.closest('[data-weather]')) return;
      var s = d.getAttribute('style') || '';
      if (s.indexOf('rainFall') >= 0) drops.push(d);
      else if (s.indexOf('boltStrike') >= 0 || s.indexOf('lightning') >= 0) bolts.push(d);
    });
    return { drops: drops, bolts: bolts };
  }

  var sunEl = null, snowEl = null, twistEl = null;
  function applyWeather() {
    var w = weatherNow();
    var p = weatherParts();
    var wet = (w === 'rain' || w === 'storm');
    p.drops.forEach(function (d) { d.style.display = wet ? '' : 'none'; });
    p.bolts.forEach(function (b) { b.style.display = (w === 'storm') ? '' : 'none'; });

    var cube = document.getElementById('cuboid-os');
    if (!cube) return;

    // Sun: a warm light inside the glass, not a drawn sun — the cube is lit
    // from within by whatever the weather is.
    if (!sunEl) {
      sunEl = document.createElement('div');
      sunEl.setAttribute('data-weather', 'sun');
      sunEl.style.cssText = 'position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;'
        + 'border-radius:50%;pointer-events:none;transform:translateZ(0);filter:blur(26px);'
        + 'background:radial-gradient(circle,rgba(255,214,140,.75),rgba(255,170,80,.28) 46%,transparent 72%);';
      cube.appendChild(sunEl);
    }
    sunEl.style.display = (w === 'sun') ? '' : 'none';

    // Snow: slow, drifting, and it uses the rain keyframe at a crawl rather
    // than a new animation — same fall, different weight.
    if (!snowEl) {
      snowEl = document.createElement('div');
      snowEl.setAttribute('data-weather', 'snow');
      snowEl.style.cssText = 'position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;';
      var flakes = '';
      for (var i = 0; i < 34; i++) {
        // Two layers of depth so it falls THROUGH the cube rather than on one plane.
        var z = (i % 3 === 0) ? 90 : (i % 3 === 1) ? 10 : -70;
        var x = Math.round((i * 29) % 94) + 3;
        var dur = (4.6 + (i % 6) * 0.9).toFixed(1), del = ((i % 9) * 0.6).toFixed(1);
        var sz = 2 + (i % 3);
        flakes += '<div style="position:absolute;left:' + x + '%;top:0;width:' + sz + 'px;height:' + sz + 'px;'
          + 'transform:translateZ(' + z + 'px);animation:snowFall ' + dur + 's linear infinite ' + del + 's;">'
          + '<div style="width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.95);'
          + 'box-shadow:0 0 7px rgba(210,240,255,.95);animation:snowDrift ' + (2.2 + (i % 4) * 0.7).toFixed(1) + 's ease-in-out infinite;"></div></div>';
      }
      snowEl.innerHTML = flakes;
      cube.appendChild(snowEl);
    }
    snowEl.style.display = (w === 'snow') ? '' : 'none';

    // ── THE TWISTER ──
    if (!twistEl) {
      twistEl = document.createElement('div');
      twistEl.setAttribute('data-weather', 'twister');
      twistEl.style.cssText = 'position:absolute;left:50%;top:0;width:170px;height:300px;margin-left:-85px;'
        + 'pointer-events:none;transform-style:preserve-3d;animation:twistSway 4.2s ease-in-out infinite;';
      var funnel = '';
      // A funnel is rings that get smaller and spin faster toward the ground.
      for (var t = 0; t < 9; t++) {
        var wpc = 100 - t * 9;                       // narrowing
        var top = 8 + t * 10.5;
        var spin = (1.5 - t * 0.12).toFixed(2);
        funnel += '<div style="position:absolute;left:' + ((100 - wpc) / 2) + '%;top:' + top + '%;width:' + wpc + '%;height:' + (13 - t * 0.6) + '%;'
          + 'border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(190,225,255,.05),rgba(150,195,245,.30) 62%,rgba(120,170,230,.06) 82%,transparent 92%);'
          + 'box-shadow:inset 0 0 14px rgba(200,230,255,.30);animation:twistSpin ' + spin + 's linear infinite;"></div>';
      }
      // debris caught in it
      for (var q = 0; q < 10; q++) {
        var r = 16 + (q % 5) * 11, sp = (0.7 + (q % 4) * 0.25).toFixed(2), ty = 18 + q * 7;
        funnel += '<div style="position:absolute;left:50%;top:' + ty + '%;width:3px;height:3px;margin-left:-1.5px;'
          + '--r:' + r + 'px;border-radius:50%;background:rgba(220,240,255,.75);box-shadow:0 0 6px rgba(180,220,255,.8);'
          + 'animation:twistDebris ' + sp + 's linear infinite;"></div>';
      }
      twistEl.innerHTML = funnel;
      cube.appendChild(twistEl);
    }
    twistEl.style.display = (w === 'twister') ? '' : 'none';
    // A twister brings its rain with it.
    if (w === 'twister') p.drops.forEach(function (d) { d.style.display = ''; });

    applySettle();
  }

  // ── SNOW SETTLING ON THE FLOOR ──────────────────────────────────
  // Sarah, 22 Aug: "let some of the snow build up on the inside of the cube.
  // this will make the flowers act like they would if it was real. a sped up
  // process." So it piles up while it snows, and MELTS in the sun — which is
  // what waters the flower, exactly as thawing snow does.
  var settleEl = null;
  function snowDepth() {
    var v = parseFloat(localStorage.getItem('q-cube-snow') || '0');
    return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0;
  }
  function setSnowDepth(v) {
    v = Math.max(0, Math.min(1, v));
    try { localStorage.setItem('q-cube-snow', String(v)); } catch (e) {}
    applySettle();
    document.dispatchEvent(new CustomEvent('cube:snow', { detail: { depth: v } }));
  }
  function applySettle() {
    var cube = document.getElementById('cuboid-os');
    if (!cube) return;
    if (!settleEl) {
      settleEl = document.createElement('div');
      settleEl.setAttribute('data-weather', 'settle');
      cube.appendChild(settleEl);
    }
    var d = snowDepth();
    var lift = 150 - d * 30;           // the surface rises as it piles up
    settleEl.style.cssText = 'position:absolute;inset:0;pointer-events:none;'
      + 'transform:rotateX(-90deg) translateZ(' + lift + 'px);'
      + 'border-radius:4px;opacity:' + (d > 0.02 ? 1 : 0) + ';transition:opacity .5s;'
      + 'background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,' + (0.30 + d * 0.5).toFixed(2) + '),'
      + 'rgba(226,242,255,' + (0.16 + d * 0.4).toFixed(2) + ') 62%,rgba(200,225,250,.10) 88%);'
      + 'box-shadow:0 0 26px rgba(200,235,255,' + (0.20 + d * 0.35).toFixed(2) + ');';
  }

  // Sped up on purpose — a season in a minute, not a winter.
  setInterval(function () {
    var w = weatherNow();
    if (w === 'snow') { var d = snowDepth(); if (d < 1) setSnowDepth(d + 0.02); }
    else if (w === 'sun') { var s = snowDepth(); if (s > 0) setSnowDepth(s - 0.03); }
  }, 700);

  // ── YOUR FINGER, ON A FACE AT ANY ANGLE ─────────────────────────
  // You turn the cube where you want it and then play on it — so a touch has to
  // be mapped onto a face that is rotated in space, not squared up for you.
  //
  // The trick: three markers sit at known points on the face — (0,0), (300,0)
  // and (0,300) in its own coordinates. Whatever the cube's rotation, the
  // browser reports where those three landed ON SCREEN, and three points are
  // exactly enough to solve the mapping back. Recomputed on every touch, so it
  // is always right for wherever the cube is at that moment.
  function faceMapper(host) {
    var pts = ['0,0', '300,0', '0,300'].map(function (p, i) {
      var d = document.createElement('div');
      var xy = p.split(',');
      d.setAttribute('data-mark', i);
      d.style.cssText = 'position:absolute;left:' + (xy[0] / 3) + '%;top:' + (xy[1] / 3) + '%;'
        + 'width:1px;height:1px;pointer-events:none;opacity:0;';
      host.appendChild(d);
      return d;
    });
    return function (clientX, clientY) {
      var r = pts.map(function (d) {
        var b = d.getBoundingClientRect();
        return { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      });
      var a = r[0];
      var ux = r[1].x - a.x, uy = r[1].y - a.y;      // the face's own x axis, on screen
      var vx = r[2].x - a.x, vy = r[2].y - a.y;      // and its y axis
      var det = ux * vy - uy * vx;
      if (!det) return null;                          // edge-on: no face to draw on
      var px = clientX - a.x, py = clientY - a.y;
      return {
        x: (px * vy - py * vx) / det * 300,
        y: (ux * py - uy * px) / det * 300
      };
    };
  }

  // ── DRAW ────────────────────────────────────────────────────────
  // Neon, and it stays. One canvas per side, kept in this browser.
  var NEON = ['#ff2d95', '#00e5ff', '#7CFF4F', '#ffd166', '#b78cff', '#ffffff'];
  function drawKey(face) { return 'q-cube-draw-' + face; }

  PANELS.draw = {
    name: 'draw',
    mount: function (el, face) {
      el.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;';
      var cv = document.createElement('canvas');
      cv.width = 300; cv.height = 300;
      cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;';
      wrap.appendChild(cv);

      // The colours, along the bottom of the face.
      var bar = document.createElement('div');
      bar.style.cssText = 'position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;justify-content:center;padding:7px;';
      var colour = NEON[0];
      NEON.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-neon', c);
        b.style.cssText = 'width:17px;height:17px;border-radius:50%;border:none;cursor:pointer;background:' + c
          + ';box-shadow:0 0 8px ' + c + ',inset 0 0 0 1px rgba(255,255,255,.6);opacity:' + (c === colour ? '1' : '.45') + ';';
        b.onclick = function (ev) {
          ev.stopPropagation();
          colour = c;
          Array.prototype.forEach.call(bar.children, function (x) {
            if (x.getAttribute('data-neon')) x.style.opacity = (x.getAttribute('data-neon') === c) ? '1' : '.45';
          });
        };
        bar.appendChild(b);
      });
      var rub = document.createElement('button');
      rub.type = 'button';
      rub.textContent = 'rub out';
      rub.style.cssText = 'margin-left:8px;font-family:inherit;font-size:8px;letter-spacing:.1em;border:none;cursor:pointer;'
        + 'color:rgba(220,240,255,.8);background:rgba(255,255,255,.08);border-radius:6px;padding:0 7px;';
      rub.onclick = function (ev) {
        ev.stopPropagation();
        var g = cv.getContext('2d');
        g.clearRect(0, 0, 300, 300);
        try { localStorage.removeItem(drawKey(face)); } catch (e) {}
      };
      bar.appendChild(rub);
      wrap.appendChild(bar);
      el.appendChild(wrap);

      var g = cv.getContext('2d');
      g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 4;

      // what was drawn before
      try {
        var saved = localStorage.getItem(drawKey(face));
        if (saved) { var img = new Image(); img.onload = function () { g.drawImage(img, 0, 0); }; img.src = saved; }
      } catch (e) {}

      var drawing = false, last = null;
      var mapTo = faceMapper(wrap);
      function at(e) { return mapTo(e.clientX, e.clientY); }
      cv.addEventListener('pointerdown', function (e) {
        e.stopPropagation();               // draw here; the cube turns from the background
        var p = at(e);
        if (!p) return;                    // the face is edge-on — nothing to draw on
        drawing = true; last = p;
        cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener('pointermove', function (e) {
        if (!drawing) return;
        e.stopPropagation();
        var p = at(e);
        if (!p) return;
        g.strokeStyle = colour;
        g.shadowColor = colour; g.shadowBlur = 9;
        g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
        last = p;
      });
      function stop(e) {
        if (!drawing) return;
        drawing = false;
        if (e) e.stopPropagation();
        try { localStorage.setItem(drawKey(face), cv.toDataURL('image/png')); } catch (err) {}
      }
      cv.addEventListener('pointerup', stop);
      cv.addEventListener('pointercancel', stop);
    }
  };


  // ── THE GARDEN ──────────────────────────────────────────────────
  // Sarah, 22 Aug: "a flower that starts as a seed and you water it and watch
  // it grow every time you change the weather to rain and then sun ... plant
  // the seeds (lots of different ones and say what they are)".
  //
  // It works the way it works outside, sped up: RAIN wets the ground, and it is
  // the SUN AFTER the rain that makes it grow. Snow does neither while it lies —
  // the plant sits dormant — but when the sun melts it, that meltwater counts,
  // which is exactly what thawing snow does in a real garden.
  var FLOWERS = [
    { id: 'sunflower', name: 'Sunflower',  petal: '#ffd23f', mid: '#6b4423', shape: 'round',  petals: 14, tall: 1.15 },
    { id: 'poppy',     name: 'Poppy',      petal: '#ff3b30', mid: '#241a12', shape: 'round',  petals: 5,  tall: 0.95 },
    { id: 'bluebell',  name: 'Bluebell',   petal: '#5b6ee8', mid: '#3a46a8', shape: 'bell',   petals: 5,  tall: 0.9 },
    { id: 'daffodil',  name: 'Daffodil',   petal: '#ffe066', mid: '#ff9f1c', shape: 'trumpet',petals: 6,  tall: 1.0 },
    { id: 'tulip',     name: 'Tulip',      petal: '#ff5d8f', mid: '#c9184a', shape: 'cup',    petals: 6,  tall: 1.0 },
    { id: 'lavender',  name: 'Lavender',   petal: '#b388ff', mid: '#7c4dff', shape: 'spike',  petals: 9,  tall: 1.1 },
    { id: 'cornflower',name: 'Cornflower', petal: '#4d7cfe', mid: '#26418f', shape: 'round',  petals: 8,  tall: 0.95 },
    { id: 'marigold',  name: 'Marigold',   petal: '#ff8c1a', mid: '#a63d00', shape: 'round',  petals: 12, tall: 0.85 },
    { id: 'snowdrop',  name: 'Snowdrop',   petal: '#f2f7ff', mid: '#9fd0a8', shape: 'bell',   petals: 3,  tall: 0.75 },
    { id: 'foxglove',  name: 'Foxglove',   petal: '#d183e8', mid: '#8e44ad', shape: 'spike',  petals: 7,  tall: 1.25 },
    { id: 'daisy',     name: 'Daisy',      petal: '#ffffff', mid: '#ffd23f', shape: 'round',  petals: 12, tall: 0.7 },
    { id: 'rose',      name: 'Rose',       petal: '#e01e5a', mid: '#8b0d33', shape: 'cup',    petals: 8,  tall: 0.95 }
  ];
  var STAGE_NAME = ['a seed', 'sprouting', 'growing', 'in bud', 'in flower', 'in full bloom'];

  var BED = 3;              // how many can go in at once
  var PER_STAGE = 2;        // Sarah, 22 Aug: "it needs to grow slower ... like
                            // half that time". Two waterings a stage, not one.
  function gardenKey(face) { return 'q-cube-garden-' + face; }
  function gardenRead(face) {
    var g;
    try { g = JSON.parse(localStorage.getItem(gardenKey(face)) || 'null'); } catch (e) { g = null; }
    if (!g) return { plants: [], wet: false };
    // A garden saved when only one plant could go in is carried over rather
    // than thrown away.
    if (!g.plants) {
      return g.seed
        ? { plants: [{ seed: g.seed, water: (g.stage || 0) * PER_STAGE }], wet: !!g.wet }
        : { plants: [], wet: !!g.wet };
    }
    return g;
  }
  function stageOf(p) { return Math.min(5, Math.floor((p.water || 0) / PER_STAGE)); }
  function gardenWrite(face, g) {
    try { localStorage.setItem(gardenKey(face), JSON.stringify(g)); } catch (e) {}
  }

  // The drawing. One set of parts, shaped by the flower — so twelve seeds look
  // like twelve different plants without twelve drawings.
  function plantSvg(g) {
    var soil = '<rect x="0" y="232" width="300" height="68" fill="rgba(58,40,28,.55)"/>'
             + '<rect x="0" y="228" width="300" height="7" rx="3" fill="rgba(92,66,44,.75)"/>';
    var body = '';
    (g.plants || []).forEach(function (p, i) {
      body += onePlant(p, [78, 150, 222][i] || 150, 0.78);
    });
    return '<svg viewBox="0 0 300 300" width="100%" height="100%">' + soil + body + '</svg>';
  }

  function onePlant(g, cx, scale) {
    var f = null;
    for (var i = 0; i < FLOWERS.length; i++) if (FLOWERS[i].id === g.seed) f = FLOWERS[i];
    if (!f) return '';
    var s = stageOf(g);

    var H = 150 * f.tall * scale;
    var grow = [0, 0.10, 0.34, 0.62, 0.88, 1][s];
    var top = 232 - H * grow;
    // NOT soil — the ground is drawn once by plantSvg now. Referring to it
    // here threw on every draw and silently killed the repaint.
    var parts = '';

    var L = 26 * scale;                       // leaf reach
    if (s === 0) {
      parts += '<ellipse cx="' + cx + '" cy="242" rx="' + (7 * scale).toFixed(1) + '" ry="' + (5 * scale).toFixed(1) + '" fill="#8d6e4f" stroke="rgba(0,0,0,.3)"/>';
    } else {
      parts += '<path d="M' + cx + ' 232 Q ' + (cx + (s % 2 ? 7 : -7)) + ' ' + ((232 + top) / 2) + ' ' + cx + ' ' + top + '" '
             + 'stroke="#4caf50" stroke-width="' + (1.8 + s * 0.55).toFixed(1) + '" fill="none" stroke-linecap="round"/>';
      if (s >= 2) {
        parts += '<path d="M' + cx + ' ' + (top + H * grow * 0.45) + ' q -' + L + ' -9 -' + (L * 1.2).toFixed(0) + ' -26 q ' + (L * 0.9).toFixed(0) + ' 2 ' + (L * 1.2).toFixed(0) + ' 26 z" fill="#66bb6a"/>';
      }
      if (s >= 3) {
        parts += '<path d="M' + cx + ' ' + (top + H * grow * 0.28) + ' q ' + L + ' -9 ' + (L * 1.2).toFixed(0) + ' -26 q -' + (L * 0.9).toFixed(0) + ' 2 -' + (L * 1.2).toFixed(0) + ' 26 z" fill="#4caf50"/>';
      }
    }

    if (s === 3) {                                  // bud
      parts += '<ellipse cx="' + cx + '" cy="' + (top - 5) + '" rx="' + (9 * scale).toFixed(1) + '" ry="' + (14 * scale).toFixed(1) + '" fill="' + f.mid + '" opacity=".9"/>'
             + '<ellipse cx="' + cx + '" cy="' + (top - 8) + '" rx="' + (6 * scale).toFixed(1) + '" ry="' + (9 * scale).toFixed(1) + '" fill="' + f.petal + '" opacity=".55"/>';
    } else if (s >= 4) {                            // open
      var R = ((s === 5) ? 34 : 26) * scale;
      var head = '';
      if (f.shape === 'spike') {
        for (var k = 0; k < f.petals; k++) {
          var yy = top - 3 - k * 8 * scale, ww = (13 - k * 0.8) * scale;
          head += '<ellipse cx="' + (cx + (k % 2 ? 5 : -5)) + '" cy="' + yy.toFixed(1) + '" rx="' + ww.toFixed(1) + '" ry="' + (5.5 * scale).toFixed(1) + '" fill="' + f.petal + '" opacity="' + (0.95 - k * 0.05).toFixed(2) + '"/>';
        }
      } else if (f.shape === 'bell') {
        for (var b = 0; b < f.petals; b++) {
          var bx = cx + (b - (f.petals - 1) / 2) * 13 * scale;
          head += '<path d="M' + bx.toFixed(1) + ' ' + (top - 2) + ' q -' + (9 * scale).toFixed(1) + ' ' + (16 * scale).toFixed(1) + ' 0 ' + (22 * scale).toFixed(1) + ' q ' + (9 * scale).toFixed(1) + ' -' + (6 * scale).toFixed(1) + ' 0 -' + (22 * scale).toFixed(1) + ' z" fill="' + f.petal + '"/>'
                + '<ellipse cx="' + bx.toFixed(1) + '" cy="' + (top - 2) + '" rx="' + (9 * scale).toFixed(1) + '" ry="' + (4 * scale).toFixed(1) + '" fill="' + f.mid + '" opacity=".85"/>';
        }
      } else if (f.shape === 'cup' || f.shape === 'trumpet') {
        head += '<path d="M' + (cx - R * 0.7).toFixed(1) + ' ' + (top - 2) + ' q ' + (R * 0.7).toFixed(1) + ' ' + (R * 1.1).toFixed(1) + ' ' + (R * 1.4).toFixed(1) + ' 0 q -' + (R * 0.55).toFixed(1) + ' -' + (R * 0.85).toFixed(1) + ' -' + (R * 1.4).toFixed(1) + ' 0 z" fill="' + f.petal + '"/>';
        if (f.shape === 'trumpet') head += '<ellipse cx="' + cx + '" cy="' + (top + 4) + '" rx="' + (R * 0.42).toFixed(1) + '" ry="' + (R * 0.5).toFixed(1) + '" fill="' + f.mid + '"/>';
      } else {
        for (var p = 0; p < f.petals; p++) {
          var a = (p / f.petals) * Math.PI * 2;
          var px = (cx + Math.cos(a) * R * 0.62).toFixed(1), py = (top + Math.sin(a) * R * 0.62).toFixed(1);
          head += '<ellipse cx="' + px + '" cy="' + py + '" rx="' + (R * 0.42).toFixed(1) + '" ry="' + (R * 0.24).toFixed(1) + '" fill="' + f.petal + '" '
                + 'transform="rotate(' + (a * 180 / Math.PI).toFixed(1) + ' ' + px + ' ' + py + ')"/>';
        }
        head += '<circle cx="' + cx + '" cy="' + top + '" r="' + (R * 0.3).toFixed(1) + '" fill="' + f.mid + '"/>';
      }
      parts += head;
    }
    return parts;
  }

  PANELS.garden = {
    name: 'garden',
    mount: function (el, face) {
      el.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;';
      el.appendChild(wrap);

      var art = document.createElement('div');
      art.style.cssText = 'position:absolute;inset:0;';
      wrap.appendChild(art);

      var head = document.createElement('div');
      head.style.cssText = 'position:absolute;left:0;right:0;top:0;padding:10px 12px;font-family:\'IBM Plex Mono\',monospace;'
        + 'font-size:9px;letter-spacing:.14em;color:rgba(220,245,255,.9);text-shadow:0 0 10px rgba(120,220,255,.6);';
      wrap.appendChild(head);

      var seeds = document.createElement('div');
      seeds.style.cssText = 'position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:6px 6px 7px;';
      wrap.appendChild(seeds);

      function paint() {
        var g = gardenRead(face);
        art.innerHTML = plantSvg(g);

        var planted = g.plants || [];
        var names = planted.map(function (p) {
          var f = null;
          for (var i = 0; i < FLOWERS.length; i++) if (FLOWERS[i].id === p.seed) f = FLOWERS[i];
          return f ? (f.name + ' ' + STAGE_NAME[stageOf(p)]) : '';
        }).filter(Boolean);

        var allDone = planted.length && planted.every(function (p) { return stageOf(p) >= 5; });
        var need = allDone ? 'done' : (g.wet ? 'needs sun' : 'needs rain');

        head.innerHTML = planted.length
          ? ('<b style="letter-spacing:.05em">' + names.join(' &middot; ') + '</b>'
             + '<span style="float:right;color:rgba(190,235,255,.65)">' + need + '</span>')
          : ('PICK A SEED<span style="float:right;color:rgba(190,235,255,.5)">room for ' + BED + '</span>');

        var chosen = {};
        planted.forEach(function (p) { chosen[p.seed] = true; });
        var full = planted.length >= BED;
        seeds.innerHTML = FLOWERS.map(function (x) {
          var on = !!chosen[x.id];
          return '<button data-seed="' + x.id + '" title="' + x.name + '" style="font-family:inherit;font-size:6.5px;letter-spacing:.04em;'
            + 'border:none;cursor:' + (full && !on ? 'default' : 'pointer') + ';border-radius:4px;padding:2px 4px;'
            + 'opacity:' + (full && !on ? '.35' : '1') + ';color:' + (on ? '#0b0f18' : 'rgba(230,245,255,.85)') + ';'
            + 'background:' + (on ? x.petal : 'rgba(255,255,255,.10)') + ';box-shadow:0 0 6px ' + (on ? x.petal : 'transparent') + ';">'
            + x.name + '</button>';
        }).join('')
        + (planted.length ? '<button data-dig style="font-family:inherit;font-size:6.5px;letter-spacing:.08em;border:none;cursor:pointer;'
            + 'border-radius:4px;padding:2px 5px;color:rgba(255,190,190,.9);background:rgba(255,120,120,.14);">DIG UP</button>' : '');
      }

      seeds.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      seeds.addEventListener('click', function (e) {
        e.stopPropagation();
        var g = gardenRead(face);
        if (e.target.closest('[data-dig]')) {
          gardenWrite(face, { plants: [], wet: false });
          paint();
          return;
        }
        var b = e.target.closest('[data-seed]');
        if (!b) return;
        var id = b.getAttribute('data-seed');
        g.plants = g.plants || [];
        // Tapping one already in the ground takes it out again; otherwise it
        // goes in the next free space, up to BED of them.
        var at = -1;
        for (var i = 0; i < g.plants.length; i++) if (g.plants[i].seed === id) at = i;
        if (at >= 0) g.plants.splice(at, 1);
        else if (g.plants.length < BED) g.plants.push({ seed: id, water: 0 });
        gardenWrite(face, g);
        paint();
      });

      function onWeather() {
        var g = gardenRead(face);
        if (!g.plants || !g.plants.length) return;
        var w = weatherNow();
        // Rain — and a twister brings its rain with it — wets the ground.
        if (w === 'rain' || w === 'storm' || w === 'twister') {
          if (!g.wet) { g.wet = true; gardenWrite(face, g); paint(); }
          return;
        }
        // Sun on wet ground is what actually makes them grow. Everything in the
        // bed drinks the same rain, and it takes PER_STAGE waterings to move a
        // plant on a stage.
        if (w === 'sun' && g.wet) {
          g.plants.forEach(function (p) {
            if (stageOf(p) < 5) p.water = (p.water || 0) + 1;
          });
          g.wet = false;
          gardenWrite(face, g);
          paint();
        }
      }
      // Melting snow is water too — the sun takes the pile down and the plant
      // drinks it, which is why a snowy week still counts.
      function onSnow(e) {
        var g = gardenRead(face);
        if (!g.plants || !g.plants.length) return;
        if (weatherNow() === 'sun' && e.detail && e.detail.depth > 0 && !g.wet) {
          g.wet = true; gardenWrite(face, g); paint();
        }
      }
      document.addEventListener('cube:weather', onWeather);
      document.addEventListener('cube:snow', onSnow);

      paint();
      onWeather();
    }
  };

  // Anything added to PANELS later shows up in the picker without touching
  // this code again — that is the whole point of the registry.
  window.qCubePanels = PANELS;
  window.qCubeRefresh = function () { paintAllFaces(); paintPicker(); };

  paintAllFaces();
  paintPicker();
  applyWeather();

  // The stage cannot reflow (fixed 560px, and 3D faces spill if you make them
  // fluid), so on a narrow screen it is scaled to fit instead.
  var scaler = document.querySelector('.scaler');
  function fit() {
    if (!scaler) return;
    var avail = document.documentElement.clientWidth - 36;
    var s = Math.min(1, avail / 560);
    scaler.style.setProperty('--s', s);
    scaler.style.transform = s < 1 ? 'scale(' + s + ')' : '';
    scaler.style.height = s < 1 ? (620 * s) + 'px' : '';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
