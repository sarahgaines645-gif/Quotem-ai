<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trips</title>
<script src="/q-auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0;
    background: #f3f3f3;
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
}
/* Top padding is deliberately tight. The title is not the product — the map and
   the controls have to be on the first screen without scrolling. */
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 20px 90px; }

header.page { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.logo { font-size: 28px; font-weight: 700; line-height: 1; }
.dot { color: #e91e63; }
h1.heading { font-size: 24px; font-weight: 600; margin: 0; line-height: 1; }
header.page .spacer { flex: 1; }
a.back {
    font-size: 14px; color: rgba(0,0,0,0.55); text-decoration: none;
    padding: 9px 15px; background: #f3f3f3; border-radius: 12px;
    box-shadow: 4px 4px 10px #ababab, -3px -3px 8px #ffffff;
}
a.back:hover { color: #1a1a1a; }

/* ── the brief ───────────────────────────────────────────
   NOTHING on this page is indented. Everything raises. Depth comes from
   things standing off the surface, never from wells cut into it.
   One tight row, because controls are not the point of the page. */
.panel {
    background: #f3f3f3; border-radius: 18px; padding: 14px;
    box-shadow: 7px 7px 16px #ababab, -5px -5px 13px #ffffff;
}
.brief { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.field { flex: 1 1 120px; min-width: 0; }
.field.go { flex: 0 0 auto; }
.field label {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: rgba(0,0,0,0.42); margin-bottom: 5px;
}
.field input, .field select {
    width: 100%; border: 0; outline: 0; background: #f3f3f3;
    font-family: inherit; font-size: 14px; font-weight: 500; color: #1a1a1a;
    padding: 9px 12px; border-radius: 11px;
    box-shadow: 4px 4px 10px #ababab, -3px -3px 8px #ffffff;
    -webkit-appearance: none; appearance: none;
}
.field select { cursor: pointer; }
.field input:focus, .field select:focus { box-shadow: 6px 6px 14px #a3a3a3, -4px -4px 10px #ffffff; }
.btn {
    border: 0; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600;
    color: #1a1a1a; background: #f3f3f3; padding: 10px 18px; border-radius: 11px;
    box-shadow: 5px 5px 13px #ababab, -4px -4px 10px #ffffff;
    display: inline-flex; align-items: center; gap: 9px; justify-content: center; white-space: nowrap;
}
.btn:hover { color: #e91e63; }
.btn:active { box-shadow: 2px 2px 6px #ababab, -2px -2px 5px #ffffff; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 17px; height: 17px; }

/* ── the map ─────────────────────────────────────────────
   The ground is RAISED, and modelled — it should look like it was pressed
   out of clay. The land is exactly the same colour as the sea; the only
   thing that makes it visible is that it stands out of it, lit from the
   north-west like every card on this page. See the #relief filter.

   The whole effect lives in the #relief filter below. Its lengths are in
   viewBox units, so scaleRelief() rescales them whenever the map zooms —
   without that, zooming in melts the coast into whipped cream. */
.map-card { margin-top: 14px; padding: 12px; }
.frame {
    position: relative; border-radius: 14px; overflow: hidden;
    background: #ececec;                       /* the sea. The land is the SAME
                                                  colour: it is visible only because
                                                  it is raised out of it. */
    height: 300px;                             /* the map is a glance, not the page */
}
#map { display: block; width: 100%; height: 100%; touch-action: none; }
@media (max-width: 760px) { .frame { height: 220px; } }

#land { fill: #ececec; }
.hit { fill: transparent; cursor: pointer; }
.case-body { fill: #e91e63; }
.case-trim { fill: #ffffff; }
.place { fill: #e91e63; }
.origin-dot { fill: #1a1a1a; }
.origin-ring { fill: none; stroke: #1a1a1a; stroke-width: 2; opacity: .28; }

.map-tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: #f3f3f3; border-radius: 12px; padding: 11px 14px;
    box-shadow: 6px 6px 16px #9d9d9d, -5px -5px 12px #ffffff;
    font-size: 13px; line-height: 1.45; white-space: nowrap; z-index: 4;
}
.map-tip b { display: block; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.map-tip .m { color: rgba(0,0,0,0.55); }
.map-tip .pink { color: #e91e63; font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 13px; color: rgba(0,0,0,0.55); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.pip { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.pip.on { background: #e91e63; }
.pip.off { background: #d4d4d4; }
.pip.case { width: 14px; height: 11px; border-radius: 2px; background: #e91e63; position: relative; }
.pip.case::after { content: ""; position: absolute; left: 4px; top: -4px; width: 6px; height: 4px;
                   border: 1.5px solid #e91e63; border-bottom: 0; border-radius: 3px 3px 0 0; }

/* ── the linkmail row (Send it to them) ───────────────────
   Appears only once a link exists. Everything raised, like the rest. */
.lm-row {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin: 0 0 16px;
}
.lm-row.hide { display: none; }
.lm-url {
    flex: 1 1 240px; min-width: 0;
    font-family: inherit; font-size: 13px; color: #1a1a1a;
    background: #f3f3f3; border: 0; outline: none;
    padding: 11px 14px; border-radius: 11px;
    box-shadow: 5px 5px 13px #ababab, -4px -4px 10px #ffffff;
    text-overflow: ellipsis;
}
.lm-note { font-size: 13px; color: rgba(0,0,0,0.5); }

/* ── results ─────────────────────────────────────────────── */
section.results { margin-top: 26px; }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.results-head h2 { font-size: 19px; font-weight: 600; margin: 0; color: rgba(0,0,0,0.75); }
.results-head .count { font-size: 13px; color: rgba(0,0,0,0.45); }

/* ── the destinations, as postcards ──────────────────────
   A raised card of the same material as the page. The photo sits on it like
   a print, with a paper margin round it and its own lift, and a stamp in the
   corner carries its place in the running order. Everything raises.

   Small on purpose: these are a shortlist to scan, so more of them fit on a
   screen at once than read like a brochure page. */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(198px, 1fr)); }
.trip {
    background: #f3f3f3; border-radius: 12px; padding: 8px;
    box-shadow: 6px 6px 14px #ababab, -5px -5px 11px #ffffff;
    display: flex; flex-direction: column; gap: 7px; transition: box-shadow .16s;
}
.trip.pick { box-shadow: 9px 9px 20px #a6a6a6, -7px -7px 15px #ffffff; }
.trip.lit  { box-shadow: 11px 11px 24px #9e9e9e, -8px -8px 17px #ffffff; }

.pc { position: relative; }
.trip .shot {
    position: relative; aspect-ratio: 2 / 1; border-radius: 6px; overflow: hidden;
    background: #e9e9e9; border: 3px solid #fbfbfb;      /* the print's paper margin */
    box-shadow: 3px 3px 8px #b4b4b4, -2px -2px 6px #ffffff;
}
.trip .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.trip .noshot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-size: 11px; color: rgba(0,0,0,0.35); text-align: center; padding: 6px; }
.stamp {
    position: absolute; top: -6px; right: -6px; width: 24px; height: 28px; border-radius: 3px;
    background: #f3f3f3; box-shadow: 3px 3px 8px #a8a8a8, -2px -2px 6px #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #e91e63;
}
.stamp::before { content: ""; position: absolute; inset: 2px; border-radius: 2px;
                 border: 1px dotted rgba(0,0,0,0.17); }
.trip .body { display: flex; flex-direction: column; gap: 7px; flex: 1; }
.trip h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.trip h3 small { display: block; font-size: 10.5px; font-weight: 400; color: rgba(0,0,0,0.45); margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.stat { background: #f3f3f3; border-radius: 8px; padding: 4px 6px;
        box-shadow: 3px 3px 7px #ababab, -2px -2px 5px #ffffff; }
.stat .k { font-size: 8px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(0,0,0,0.42); }
.stat .v { font-size: 13px; font-weight: 600; margin-top: 0; overflow-wrap: anywhere; }
.stat .v.absent { color: rgba(0,0,0,0.3); font-weight: 400; font-size: 12px; }
.reliability { display: flex; align-items: center; gap: 7px; font-size: 11px; color: rgba(0,0,0,0.6); }
.bar { flex: 1; height: 5px; border-radius: 3px; background: #ededed; overflow: hidden;
       box-shadow: 2px 2px 4px #bdbdbd, -1px -1px 3px #ffffff; }
.bar i { display: block; height: 100%; border-radius: 3px; background: #e91e63; }
.trip .why { font-size: 10.5px; color: rgba(0,0,0,0.45); line-height: 1.45; margin: 0; }
.trip .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.mini { border: 0; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
        color: #1a1a1a; background: #f3f3f3; padding: 6px 10px; border-radius: 8px;
        box-shadow: 3px 3px 8px #ababab, -2px -2px 6px #ffffff; }
.mini:hover { color: #e91e63; }
.mini:active { box-shadow: 2px 2px 5px #ababab, -2px -2px 4px #ffffff; }
.mini[disabled] { opacity: .5; cursor: default; }

/* ── THE BOARD — holidays she has actually found ──────────
   Everything here RAISES. Nothing is sunken, including the drop zone and
   including every box she types into: CLAUDE.md, "NO INDENTS. NONE." The
   drop zone reads as a slab lying on the page waiting to be loaded, not a
   hole cut in it. */
section.board { margin-top: 34px; }
.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.board-head h2 { font-size: 19px; font-weight: 600; margin: 0; color: rgba(0,0,0,0.75); }
.board-head .count { font-size: 13px; color: rgba(0,0,0,0.45); }

/* the strip of trips that are actually happening */
.diary { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 14px; }
.diary.hide { display: none; }
.trip-chip {
    flex: 0 0 auto; background: #f3f3f3; border-radius: 12px; padding: 9px 13px;
    box-shadow: 5px 5px 13px #ababab, -4px -4px 10px #ffffff;
    display: flex; align-items: center; gap: 10px;
}
.trip-chip .when { font-size: 15px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
.trip-chip .where { font-size: 11.5px; color: rgba(0,0,0,0.5); margin-top: 2px; overflow-wrap: anywhere; }
.trip-chip .away { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.45); white-space: nowrap; }
.trip-chip.past { opacity: .55; }
.trip-chip .marked { width: 8px; height: 8px; border-radius: 50%; background: #e91e63; flex: none; }

/* the drop zone: a raised slab, never a well */
.drop {
    background: #f3f3f3; border-radius: 16px; padding: 20px;
    box-shadow: 7px 7px 16px #ababab, -5px -5px 13px #ffffff;
    text-align: center; cursor: pointer; margin-bottom: 16px;
    transition: box-shadow .15s;
}
.drop.over { box-shadow: 12px 12px 26px #a1a1a1, -8px -8px 18px #ffffff; }
.drop .icon { width: 26px; height: 26px; color: #e91e63; display: block; margin: 0 auto 8px; }
.drop .lead { font-size: 14.5px; font-weight: 600; }
.drop .sub { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 4px; }
.drop input[type=file] { display: none; }
.drop.busy { cursor: default; }

/* what the screenshot said, before it becomes a card */
.found { margin-bottom: 16px; padding: 16px; }
.found.hide { display: none; }
.found h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.found .from { font-size: 12px; color: rgba(0,0,0,0.45); margin-bottom: 12px; }
.found-grid { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.fld label {
    display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: rgba(0,0,0,0.42); margin-bottom: 4px;
}
.fld input {
    width: 100%; border: 0; outline: 0; background: #f3f3f3;
    font-family: inherit; font-size: 13.5px; font-weight: 500; color: #1a1a1a;
    padding: 8px 11px; border-radius: 10px;
    box-shadow: 4px 4px 10px #ababab, -3px -3px 8px #ffffff;
}
.fld input::placeholder { color: rgba(0,0,0,0.3); font-weight: 400; }
.fld.wide { grid-column: 1 / -1; }
.found .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.found .warn { font-size: 12.5px; color: rgba(0,0,0,0.5); }

/* a saved holiday */
.board-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
.hol {
    background: #f3f3f3; border-radius: 12px; padding: 12px;
    box-shadow: 6px 6px 14px #ababab, -5px -5px 11px #ffffff;
    display: flex; flex-direction: column; gap: 9px;
}
.hol .top { display: flex; gap: 10px; align-items: flex-start; }
.hol .brand {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; background: #f3f3f3;
    box-shadow: 4px 4px 9px #ababab, -3px -3px 7px #ffffff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.45);
}
.hol .brand img { width: 100%; height: 100%; object-fit: contain; }
.hol h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.hol h3 small { display: block; font-size: 11px; font-weight: 400; color: rgba(0,0,0,0.45); margin-top: 2px; }
.hol .cost { font-size: 21px; font-weight: 700; line-height: 1; }
.hol .cost .basis { display: block; font-size: 10.5px; font-weight: 500; color: rgba(0,0,0,0.45); margin-top: 3px; }
.hol .lines { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 12px; color: rgba(0,0,0,0.6); }
.hol .lines b { color: #1a1a1a; font-weight: 600; }
.hol .pc-list { font-size: 12px; line-height: 1.5; margin: 0; padding: 0; list-style: none; }
.hol .pc-list li { display: flex; gap: 7px; }
.hol .pc-list li::before { content: "+"; color: #e91e63; font-weight: 700; flex: none; }
.hol .pc-list.bad li::before { content: "−"; color: rgba(0,0,0,0.4); }
.hol .said { display: flex; flex-direction: column; gap: 6px; }
.hol .say {
    background: #f3f3f3; border-radius: 10px; padding: 8px 10px;
    box-shadow: 4px 4px 9px #ababab, -3px -3px 7px #ffffff;
    font-size: 12px; line-height: 1.45;
}
.hol .say b { font-weight: 700; }
.hol .say .q { display: block; font-size: 10px; color: rgba(0,0,0,0.4); margin-top: 3px; }
.hol .dates-row { display: flex; gap: 7px; align-items: flex-end; flex-wrap: wrap; }
.hol .dates-row .fld { flex: 1 1 110px; min-width: 0; }
.hol .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hol .stamp-src {
    font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: rgba(0,0,0,0.35);
}
.hol a.visit { font-size: 12px; color: #1a1a1a; text-decoration: none; font-weight: 600; }
.hol a.visit:hover { color: #e91e63; }

.board-empty { font-size: 13.5px; color: rgba(0,0,0,0.5); line-height: 1.6; }

.msg { margin-top: 16px; padding: 14px 16px; border-radius: 13px; font-size: 14px; line-height: 1.6;
       background: #f3f3f3; box-shadow: 5px 5px 13px #ababab, -4px -4px 10px #ffffff;
       color: rgba(0,0,0,0.65); }
.msg.hide { display: none; }
.footnote { margin-top: 38px; font-size: 12.5px; color: rgba(0,0,0,0.45); line-height: 1.7; max-width: 72ch; }
.footnote b { color: rgba(0,0,0,0.6); font-weight: 600; }

.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15);
        border-top-color: #e91e63; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

@media (max-width: 700px) {
    header.page { flex-wrap: wrap; gap: 10px; }
    h1.heading { font-size: 21px; }
}
</style>
</head>
<body>
<div class="wrap">

    <header class="page">
        <div class="logo">Q<span class="dot">.</span></div>
        <h1 class="heading">Trips</h1>
        <div class="spacer"></div>
        <a href="/chat" class="back">&larr; Back to chat</a>
    </header>

    <div class="panel">
        <div class="brief">
            <div class="field">
                <label for="f-origin">Flying from</label>
                <select id="f-origin"></select>
            </div>
            <div class="field">
                <label for="f-date">Going out</label>
                <input type="date" id="f-date" />
            </div>
            <div class="field">
                <label for="f-nights">Nights</label>
                <input type="number" id="f-nights" value="7" min="1" max="28" />
            </div>
            <div class="field">
                <label for="f-temp">Warmer than</label>
                <select id="f-temp">
                    <option value="">any</option>
                    <option value="20">20&deg;C</option>
                    <option value="22">22&deg;C</option>
                    <option value="25" selected>25&deg;C</option>
                    <option value="28">28&deg;C</option>
                    <option value="30">30&deg;C</option>
                </select>
            </div>
            <div class="field">
                <label for="f-flight">Flight under</label>
                <select id="f-flight">
                    <option value="">any</option>
                    <option value="2">2 hours</option>
                    <option value="3">3 hours</option>
                    <option value="4" selected>4 hours</option>
                    <option value="5">5 hours</option>
                    <option value="8">8 hours</option>
                    <option value="12">12 hours</option>
                </select>
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <button class="btn" id="go">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
                    Find them
                </button>
            </div>
        </div>
    </div>

    <div class="panel map-card">
        <div class="frame" id="frame">
            <svg id="map" viewBox="0 0 2000 756" preserveAspectRatio="xMidYMid meet"
                 role="img" aria-labelledby="map-title map-desc">
                <title id="map-title">Where you can go</title>
                <desc id="map-desc">A world map. Places warm enough and close enough are coloured
                    pink, and the best five carry a suitcase. Every figure is also in the list below.</desc>
                <defs>
                    <radialGradient id="hot">
                        <stop offset="0"    stop-color="#e91e63" stop-opacity="0.62" />
                        <stop offset="0.55" stop-color="#e91e63" stop-opacity="0.34" />
                        <stop offset="1"    stop-color="#e91e63" stop-opacity="0" />
                    </radialGradient>
                    <clipPath id="landclip"><path id="landclip-path" d="" /></clipPath>

                    <!-- THE GROUND, MODELLED IN CLAY.
                         Sarah, 21 Aug: "I just wanted a raised map that looked
                         like it was made of clay." The first attempt lit the
                         coastline and got cut paper: a hard white rim, a dark
                         line down the other side, a flat face. What makes a
                         thing read as modelled rather than stamped is the
                         opposite of a crisp edge —

                           a THICK soft shoulder, so the coast rolls over
                           instead of stopping,
                           a dome across the whole landmass, not a rim round it,
                           the SAME material as the sea it sits in, and
                           no sliver anywhere: you cannot model a 1mm spit of
                           land in clay, so thin things get fatter and rounder.

                         Every length here is in SCREEN PIXELS, converted to map
                         units by scaleRelief(). -->
                    <filter id="relief" x="-8%" y="-10%" width="116%" height="120%"
                            color-interpolation-filters="sRGB">
                        <!-- fatten and round the coast: no slivers in clay -->
                        <feMorphology id="fx-fat" in="SourceAlpha" operator="dilate"
                                      radius="0.8" result="fat" />
                        <!-- the shoulder. This is the whole difference between
                             clay and cut paper: it is WIDE. -->
                        <feGaussianBlur id="fx-roll" in="fat" stdDeviation="7" result="soft" />
                        <!-- ...and a firm silhouette to paint inside, so the
                             shoulder lights the edge without bleeding into the sea -->
                        <feComponentTransfer in="soft" result="body">
                            <feFuncA type="linear" slope="14" intercept="-5" />
                        </feComponentTransfer>

                        <!-- the shadow it casts on the water -->
                        <feOffset id="fx-cast" in="body" dx="7" dy="9" result="castRaw" />
                        <feGaussianBlur id="fx-castblur" in="castRaw" stdDeviation="9" result="castSoft" />
                        <feColorMatrix in="castSoft" type="matrix" result="cast"
                            values="0 0 0 0 0.64  0 0 0 0 0.64  0 0 0 0 0.64  0 0 0 0.85 0" />

                        <!-- the dome: light falling across the whole mass, floored
                             so the far side darkens to a grey and never to black -->
                        <feDiffuseLighting id="fx-dome" in="soft" surfaceScale="15"
                                           diffuseConstant="1" lighting-color="#ffffff" result="domeRaw">
                            <feDistantLight azimuth="315" elevation="40" />
                        </feDiffuseLighting>
                        <feComponentTransfer in="domeRaw" result="domeTone">
                            <feFuncR type="linear" slope="0.30" intercept="0.74" />
                            <feFuncG type="linear" slope="0.30" intercept="0.74" />
                            <feFuncB type="linear" slope="0.30" intercept="0.74" />
                        </feComponentTransfer>
                        <feComposite in="domeTone" in2="body" operator="in" result="dome" />

                        <!-- a broad low sheen where the clay turns towards the
                             light. The exponent is LOW on purpose: a high one
                             gives a tight hot rim, which is what read as a sticker. -->
                        <feSpecularLighting id="fx-sheen" in="soft" surfaceScale="15"
                                            specularConstant="0.5" specularExponent="4"
                                            lighting-color="#ffffff" result="sheenRaw">
                            <feDistantLight azimuth="315" elevation="40" />
                        </feSpecularLighting>
                        <feComposite in="sheenRaw" in2="body" operator="in" result="sheen" />

                        <feMerge>
                            <feMergeNode in="cast" /><feMergeNode in="dome" />
                            <feMergeNode in="sheen" />
                        </feMerge>
                    </filter>

                    <symbol id="suitcase" viewBox="0 0 28 24">
                        <path class="case-body" d="M4 7h20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                        <path class="case-trim" d="M2 13h24v2.4H2z"/>
                        <path class="case-body" d="M10 2h8a2 2 0 0 1 2 2v3h-2.6V4.6h-6.8V7H8V4a2 2 0 0 1 2-2z"/>
                    </symbol>
                </defs>
                <path id="land" d="" fill-rule="nonzero" filter="url(#relief)" />
                <g id="hot-layer" clip-path="url(#landclip)"></g>
                <g id="marks"></g>
                <g id="hits"></g>
            </svg>
            <div class="map-tip" id="map-tip"></div>
        </div>
        <div class="legend">
            <span><i class="pip on"></i> Warm enough and in reach</span>
            <span><i class="pip case"></i> The five best</span>
            <span><i class="pip off"></i> Too far, or not warm enough</span>
        </div>
    </div>

    <div class="msg hide" id="msg"></div>

    <section class="results" id="results" hidden>
        <div class="results-head">
            <h2 id="results-title">Where you can go</h2>
            <span class="count" id="results-count"></span>
            <button class="btn" id="send-family" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/></svg>
                Send it to them
            </button>
        </div>
        <div class="lm-row hide" id="lm-row">
            <input class="lm-url" id="lm-url" readonly />
            <button class="btn" id="lm-copy" type="button">Copy</button>
            <input class="lm-url" id="lm-to" placeholder="their email address" />
            <button class="btn" id="lm-send" type="button">Email it</button>
            <span class="lm-note" id="lm-note"></span>
        </div>
        <div class="cards" id="cards"></div>
    </section>


    <section class="board" id="board">
        <div class="board-head">
            <h2>Holidays you've found</h2>
            <span class="count" id="board-count"></span>
            <button class="btn" id="send-board" type="button" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/></svg>
                Send the board
            </button>
        </div>

        <div class="diary hide" id="diary"></div>

        <div class="drop" id="drop">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <div class="lead">Drop a screenshot of a holiday here</div>
            <div class="sub">or paste one</div>
            <input type="file" id="shot-file" accept="image/*" />
        </div>

        <div class="panel found hide" id="found"></div>

        <div class="board-cards" id="board-cards"></div>
    </section>

    <p class="footnote" id="method"></p>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   THE MAP

   Flat, and deliberately not WebGL. The raise comes from the same pair
   of shadows every card on this page uses — white up and left, grey
   down and right — applied to the land silhouette as an SVG drop-shadow.
   The coast lifts off a white sea the way a card lifts off the page,
   and it costs a laptop almost nothing.

   The pink is drawn at each destination's real coordinates and clipped
   to the land, so the colour lands ON the place and stops at the coast.
   A better score spreads further.
   ══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const MAP = { W: 2000, H: 756, top: 80, bottom: -56 };   // overwritten by the data file
const svg = $('map'), frame = $('frame'), tipEl = $('map-tip');

function project(lon, lat) {
    return [(lon + 180) / 360 * MAP.W, (MAP.top - lat) / (MAP.top - MAP.bottom) * MAP.H];
}

/* EVERYTHING ON THIS MAP IS SIZED IN SCREEN PIXELS, NOT MAP UNITS.
   A length written in viewBox units means a different number of pixels at
   every zoom AND at every window width — the same 5-unit blur that is a
   crisp coastline on a laptop is invisible on a phone and turns to soup
   zoomed into the Mediterranean. So: pick the size you want on screen, and
   ask how many map units that currently is. */
function unitsPerPx() {
    const w = frame.getBoundingClientRect().width;
    return w ? view.w / w : view.w / 1000;
}

/* The clay, in screen pixels. These are the numbers it was tuned at. */
const RELIEF = { fat: 0.4, roll: 3.6, surface: 7.8, castX: 3.6, castY: 4.6, castBlur: 4.6 };
function scaleRelief() {
    const u = unitsPerPx();
    $('fx-fat').setAttribute('radius', (RELIEF.fat * u).toFixed(3));
    $('fx-roll').setAttribute('stdDeviation', (RELIEF.roll * u).toFixed(3));
    $('fx-cast').setAttribute('dx', (RELIEF.castX * u).toFixed(3));
    $('fx-cast').setAttribute('dy', (RELIEF.castY * u).toFixed(3));
    $('fx-castblur').setAttribute('stdDeviation', (RELIEF.castBlur * u).toFixed(3));
    for (const id of ['fx-dome', 'fx-sheen'])
        $(id).setAttribute('surfaceScale', (RELIEF.surface * u).toFixed(3));
}

let projReady = false, pending = null;
fetch('/assets/map-countries.json').then(r => r.json()).then(m => {
    MAP.W = m.W; MAP.H = m.H; MAP.top = m.LAT_TOP; MAP.bottom = m.LAT_BOT;
    setView(worldView());
    $('land').setAttribute('d', m.land);
    $('landclip-path').setAttribute('d', m.land);
    projReady = true;
    if (pending) { drawPlaces(pending.list, pending.origin); pending = null; }
}).catch(e => console.warn('[trips] map shapes unavailable:', e.message));

let refit;
window.addEventListener('resize', () => {
    clearTimeout(refit);
    refit = setTimeout(() => {
        if (!projReady) return;
        if (lastFit) fitTo(lastFit); else { setView(worldView()); placeMarks(); }
    }, 160);
});

/* ── the view: settle on whatever was found ─────────────────
   The relief is expensive to redraw, so the zoom lands in one step rather
   than being animated across sixty frames of it. */
let view = { x: 0, y: 0, w: 2000, h: 756 };

function setView(v) {
    view = v;
    svg.setAttribute('viewBox', `${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`);
    scaleRelief();
}
/* The frame is much wider than the world is tall, so a box shaped like the
   world letterboxes inside it and shows a lot of empty ocean. Shape the view
   like the frame instead, and the places found fill the space. */
function frameRatio() {
    const r = frame.getBoundingClientRect();
    return (r.width && r.height) ? r.width / r.height : MAP.W / MAP.H;
}
function worldView() {
    const ratio = frameRatio();
    let w = MAP.W, h = w / ratio;
    if (h > MAP.H) { h = MAP.H; w = h * ratio; }
    return { x: (MAP.W - w) / 2, y: (MAP.H - h) / 2, w, h };
}

let lastFit = null;
function fitTo(points) {
    if (!points.length) return;
    lastFit = points;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of points) {
        const [x, y] = project(p.lon, p.lat);
        x0 = Math.min(x0, x); x1 = Math.max(x1, x);
        y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    /* Breathing room, not a border. The frame is wide and short, so the
       height is what ends up choosing the zoom — pad it least. */
    const padX = Math.max(60, (x1 - x0) * 0.28), padY = Math.max(26, (y1 - y0) * 0.22);
    x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
    const ratio = frameRatio();
    let w = x1 - x0, h = y1 - y0;
    if (w / h < ratio) w = h * ratio; else h = w / ratio;
    /* The shapes are drawn from 50m Natural Earth. Past about six times in,
       even that goes polygonal, so the fit stops there. */
    w = Math.min(Math.max(w, MAP.W / 6), MAP.W); h = w / ratio;
    if (h > MAP.H) { h = MAP.H; w = h * ratio; }
    let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    cx = Math.max(w / 2, Math.min(MAP.W - w / 2, cx));
    cy = Math.max(h / 2, Math.min(MAP.H - h / 2, cy));
    setView({ x: cx - w / 2, y: cy - h / 2, w, h });
    placeMarks();
}

/* ── drawing ──────────────────────────────────────────────── */
let marksData = [], originPt = null;

function drawPlaces(list, origin) {
    if (!projReady) { pending = { list, origin }; return; }
    if (origin) originPt = origin;
    marksData = list;
    const hits = list.filter(d => d.pass);
    fitTo(hits.length ? hits.concat(originPt ? [originPt] : []) : [{ lon: 0, lat: 25 }]);
}

/* The marks, also in screen pixels. A suitcase is a suitcase whether you are
   looking at the whole world on a laptop or the Aegean on a phone. */
const MARK = { case: [17.5, 15], dot: 3.2, ring: 5, origin: 2.2, hit: 11,
               warm: [4.6, 5.6] };
function placeMarks() {
    if (!projReady) return;
    const u = unitsPerPx();
    const passing = marksData.filter(d => d.pass).sort((a, b) => b.score - a.score);

    /* the ground warmed under each place — clipped to the coast, so the
       colour lands on the land and stops at the sea */
    $('hot-layer').innerHTML = passing.map(d => {
        const [x, y] = project(d.lon, d.lat);
        const r = (MARK.warm[0] + MARK.warm[1] * (d.score || 0)) * u;
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#hot)" />`;
    }).join('');

    let out = '';
    if (originPt) {
        const [ox, oy] = project(originPt.lon, originPt.lat);
        out += `<circle class="origin-ring" cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${(MARK.ring * u).toFixed(1)}" />`
             + `<circle class="origin-dot"  cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${(MARK.origin * u).toFixed(1)}" />`;
    }
    /* Everything that made it gets a mark; the best five carry a case. */
    for (const d of passing.slice(5)) {
        const [x, y] = project(d.lon, d.lat);
        out += `<circle class="place" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(MARK.dot * u).toFixed(1)}" />`;
    }
    const cw = MARK.case[0] * u, ch = MARK.case[1] * u;
    for (const d of passing.slice(0, 5)) {
        const [x, y] = project(d.lon, d.lat);
        out += `<use href="#suitcase" x="${(x - cw / 2).toFixed(1)}" y="${(y - ch).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" />`;
    }
    $('marks').innerHTML = out;

    /* A finger is bigger than a suitcase, so what you point at is bigger too. */
    $('hits').innerHTML = marksData.map((d, i) => {
        const [x, y] = project(d.lon, d.lat);
        return `<circle class="hit" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(MARK.hit * u).toFixed(1)}" />`;
    }).join('');
}

/* ── hover ────────────────────────────────────────────────── */
svg.addEventListener('pointerover', e => {
    const t = e.target.closest('.hit'); if (!t) return;
    const d = marksData[+t.dataset.i]; if (!d) return;
    tipEl.innerHTML = `<b>${esc(d.label)}</b>`
        + `<span class="m">${d.pass
            ? `<span class="pink">${d.high}&deg;C</span> typical high &middot; ${d.rel}% of days over your bar`
            : `${d.high != null ? d.high + '&deg;C &mdash; ' : ''}${esc(d.reason || 'not a match')}`}</span><br>`
        + `<span class="m">${esc(d.flight)}${d.sea != null ? ` &middot; ${d.sea}&deg;C sea` : ''}</span>`;
    tipEl.style.opacity = '1';
    const r = frame.getBoundingClientRect(), b = t.getBoundingClientRect();
    const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let x = b.left - r.left + b.width / 2 - tw / 2;
    let y = b.top - r.top - th - 10;
    if (y < 4) y = b.bottom - r.top + 10;
    tipEl.style.left = Math.max(4, Math.min(x, r.width - tw - 4)) + 'px';
    tipEl.style.top = y + 'px';
    highlightCard(d.iata);
});
svg.addEventListener('pointerout', e => {
    if (e.target.closest('.hit')) { tipEl.style.opacity = '0'; highlightCard(null); }
});
function highlightCard(iata) {
    document.querySelectorAll('.trip').forEach(el =>
        el.classList.toggle('lit', !!iata && el.dataset.iata === iata));
}

/* ══════════════════════════════════════════════════════════════
   THE SEARCH
   ══════════════════════════════════════════════════════════════ */
let current = [];

/* The list arrives over the network, and pressing Find them before it lands
   used to send an empty airport and come back with "that departure airport is
   not in the list" — which is true, and useless. There is always an airport
   in the box now; the full list replaces it when it arrives. */
function loadOrigins() {
    $('f-origin').innerHTML = '<option value="LGW">London LGW</option>';
    return fetch('/api/trips/airports')
        .then(r => r.json())
        .then(j => {
            const origins = j.origins || [];
            if (!origins.length) return;
            const keep = $('f-origin').value;
            $('f-origin').innerHTML = origins.map(o =>
                `<option value="${o.iata}">${esc(o.city)} ${o.iata}</option>`).join('');
            $('f-origin').value = origins.some(o => o.iata === keep) ? keep : 'LGW';
        })
        .catch(() => { /* the fallback is already in the box */ });
}
function defaultDate() {
    $('f-date').value = new Date(Date.now() + 45 * 86400000).toISOString().slice(0, 10);
}
function say(text) {
    const m = $('msg');
    if (!text) { m.classList.add('hide'); return; }
    m.textContent = text; m.classList.remove('hide');
}

async function search() {
    const body = {
        origin: $('f-origin').value,
        departDate: $('f-date').value,
        nights: +$('f-nights').value || 7,
        minTempC: $('f-temp').value ? +$('f-temp').value : null,
        maxFlightH: $('f-flight').value ? +$('f-flight').value : null,
        limit: 12,
    };
    if (!body.departDate) return say('Pick a date to go out on.');

    const btn = $('go');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Checking&hellip;';
    say('');
    try {
        const res = await fetch('/api/trips/search', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const j = await res.json();
        if (!j.ok) { say(j.message || 'That search did not work.'); return; }
        render(j);
    } catch {
        say('Could not reach the trip service just now. Nothing was made up to fill the gap — try again in a moment.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg> Find them';
    }
}

function render(j) {
    current = j.results || [];

    drawPlaces((j.globe || []).map(g => ({
        iata: g.iata, lat: g.lat, lon: g.lon, label: g.label,
        pass: g.pass, score: g.score, high: g.high, rel: g.rel,
        flight: g.flight, sea: g.sea, reason: g.reason,
    })), j.origin ? { lon: j.origin.lon, lat: j.origin.lat } : null);

    const R = $('results');
    if (!current.length) {
        R.hidden = true;
        say(j.note || 'Nothing on the list clears that bar within that flying time. Try a lower temperature or a longer flight.');
        return;
    }
    R.hidden = false;
    $('results-count').textContent = `${j.total_matching} matched · showing the top ${current.length}`;

    /* "Enfidha - Hammamet International Airport" wrapped to two lines and
       shunted that card's figures a row below its neighbours'. The word adds
       nothing next to an airport's name. */
    const shortAirport = a => String(a || '')
        .replace(/\s+International\s+Airport$/i, '')
        .replace(/\s+Airport$/i, '');

    $('cards').innerHTML = current.map((d, i) => {
        const c = d.climate;
        const shot = d.photo
            ? `<img src="${esc(d.photo.url)}" alt="${esc(d.city)}" loading="lazy" />`
            : `<div class="noshot">no photo for ${esc(d.city)}</div>`;
        return `
        <article class="trip ${i < 3 ? 'pick' : ''}" data-iata="${d.iata}">
          <div class="pc"><div class="shot">${shot}</div><span class="stamp">${i + 1}</span></div>
          <div class="body">
            <h3>${esc(d.city)}<small>${esc(d.country)} &middot; ${esc(shortAirport(d.airport))}</small></h3>
            <div class="stats">
              <div class="stat"><div class="k">Typical high</div><div class="v">${c.avg_high_c}&deg;C</div></div>
              <div class="stat"><div class="k">Sea</div>
                <div class="v ${d.sea_c == null ? 'absent' : ''}">${d.sea_c == null ? 'inland' : d.sea_c + '&deg;C'}</div></div>
              <div class="stat"><div class="k">Flight</div><div class="v">${esc(d.flight.label.replace('about ', ''))}</div></div>
              <div class="stat"><div class="k">Wet days</div>
                <div class="v ${c.wet_days_pct == null ? 'absent' : ''}">${c.wet_days_pct == null ? 'unknown' : c.wet_days_pct + '%'}</div></div>
            </div>
            ${c.pct_days_over_bar != null ? `
            <div class="reliability">
              <span>${c.pct_days_over_bar}% warm enough</span>
              <span class="bar"><i style="width:${c.pct_days_over_bar}%"></i></span>
            </div>` : ''}
            <p class="why">${c.coolest_high_c}&ndash;${c.warmest_c}&deg;C over ${c.days_sampled} recorded days</p>
            <div class="foot"><button class="mini" data-price="${d.iata}">Live prices</button></div>
          </div>
        </article>`;
    }).join('');

    $('method').innerHTML =
        `<b>Where these numbers come from.</b> Temperature and sea are recorded daily observations for the
         same ${j.nights}-night window in each of the last six years, measured at the town rather than the
         airport &mdash; an airport can sit far enough inland to read several degrees hotter than the beach.
         Flight times are estimated from distance, fitted to ten verified schedules and accurate to about
         ${esc(String(current[0]?.flight?.accuracy_minutes ?? 9))} minutes; they are not a timetable.
         Prices and reviews are a separate live lookup and are never shown until they have actually been
         fetched. Photos come from Wikivoyage and Wikimedia Commons, and a place with no photo shows none.`;
}

/* ── SEND IT TO THEM — the trips linkmail ─────────────────────
   Builds a Quotem linkmail from the shortlist that is on screen: a postcard per
   place with its photo and its real figures, then the two questions that
   actually decide a holiday — which weeks they can do, and where they would
   actually go. Nothing here is invented: every number is copied off the card
   the search produced. Prices are deliberately absent because this page has not
   fetched any. */
function tripDateWindows() {
    const start = $('f-date').value;
    const nights = +$('f-nights').value || 7;
    if (!start) return [];
    const out = [];
    for (let w = 0; w < 3; w++) {
        const a = new Date(start + 'T00:00:00');
        a.setDate(a.getDate() + w * 7);
        const b = new Date(a);
        b.setDate(b.getDate() + nights);
        const f = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        out.push(f(a) + ' – ' + f(b));
    }
    return out;
}

function tripLinkmailPayload() {
    const shortAirport = a => String(a || '').replace(/\s+International\s+Airport$/i, '').replace(/\s+Airport$/i, '');
    const picks = current.slice(0, 8);
    const cards = picks.map(d => {
        const c = d.climate || {};
        const facts = [];
        if (c.avg_high_c != null) facts.push({ label: 'Typical high', value: c.avg_high_c + '°C' });
        if (d.sea_c != null) facts.push({ label: 'Sea', value: d.sea_c + '°C' });
        if (d.flight && d.flight.label) facts.push({ label: 'Flight', value: String(d.flight.label).replace('about ', '') });
        if (c.pct_days_over_bar != null) facts.push({ label: 'Warm enough', value: c.pct_days_over_bar + '% of days' });
        return {
            title: d.city,
            subtitle: [d.country, shortAirport(d.airport)].filter(Boolean).join(' · '),
            image: (d.photo && d.photo.url) || '',
            facts: facts,
            body: (c.coolest_high_c != null && c.warmest_c != null && c.days_sampled != null)
                ? (c.coolest_high_c + '–' + c.warmest_c + '°C over ' + c.days_sampled + ' recorded days.')
                : '',
        };
    });

    const windows = tripDateWindows();
    const month = $('f-date').value
        ? new Date($('f-date').value + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long' })
        : '';
    const nights = +$('f-nights').value || 7;
    const origin = $('f-origin');
    const originLabel = origin && origin.selectedIndex >= 0 ? origin.options[origin.selectedIndex].text : '';

    const bits = [];
    bits.push(nights + ' nights' + (originLabel ? ' from ' + originLabel : '') + (month ? ' in ' + month : '') + '.');
    if ($('f-temp').value) bits.push('Everywhere here clears ' + $('f-temp').value + '°C.');
    if ($('f-flight').value) bits.push('Nothing over ' + $('f-flight').value + ' hours in the air.');

    const questions = [];
    if (windows.length) questions.push({ text: 'Which weeks can you do?', type: 'dates', options: windows });
    questions.push({ text: 'Which of these would you actually go to?', type: 'checklist', options: cards.map(c => c.title) });
    questions.push({
        text: 'What can you spend each, all in?',
        type: 'slider',
        slider: { min: 300, max: 1500, step: 25, default: 650, prefix: '£', label: 'Per person' },
    });
    questions.push({ text: 'Anything we need to know — dates you cannot do, anyone not coming?', type: 'text' });

    return {
        kind: 'trip',
        title: month ? ('Where shall we go in ' + month + '?') : 'Where shall we go?',
        body: bits.join(' '),
        cards: cards,
        questions: questions,
        expiresHours: 24 * 21,
    };
}

async function sendTripToFamily() {
    const btn = $('send-family');
    if (!current.length) return say('Find some places first.');
    btn.disabled = true;
    const was = btn.innerHTML;
    btn.textContent = 'Making the page…';
    try {
        const res = await fetch('/api/linkmail/mine', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tripLinkmailPayload()),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || 'could not make the link');
        const row = $('lm-row');
        row.classList.remove('hide');
        $('lm-url').value = j.fullUrl || (location.origin + j.url);
        row.dataset.token = j.token;
        $('lm-note').textContent = '';
        say('');
    } catch (err) {
        say('That did not save: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = was;
    }
}

document.addEventListener('click', e => {
    if (e.target.closest('#send-family')) return sendTripToFamily();
    if (e.target.closest('#lm-copy')) {
        const inp = $('lm-url');
        inp.select();
        if (navigator.clipboard) navigator.clipboard.writeText(inp.value).catch(() => document.execCommand('copy'));
        else document.execCommand('copy');
        $('lm-note').textContent = 'Copied.';
        return;
    }
    if (e.target.closest('#lm-send')) {
        const token = $('lm-row').dataset.token;
        const to = $('lm-to').value.trim();
        if (!token) return;
        if (!to) { $('lm-note').textContent = 'Who to?'; return; }
        $('lm-note').textContent = 'Sending…';
        fetch('/api/linkmail/mine/' + token + '/send', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to: to }),
        }).then(r => r.json().then(j => ({ ok: r.ok, j })))
          .then(({ ok, j }) => { $('lm-note').textContent = ok ? ('Sent to ' + to) : (j.message || 'That did not send.'); })
          .catch(() => { $('lm-note').textContent = 'That did not send.'; });
        return;
    }
    const b = e.target.closest('[data-price]');
    if (b) { b.disabled = true; b.textContent = 'Live prices coming next'; }
});

$('go').addEventListener('click', search);
loadOrigins();
defaultDate();

/* ══════════════════════════════════════════════════════════════
   THE BOARD — the holidays she has actually found

   The search above answers "where is warm". This is the half that keeps
   things: screenshot a listing on anyone's website, drop it here, and it
   becomes a card with the price, the company, the link and what is good and
   bad about it. Send the board out and the family's answers come back onto
   the cards.

   ⚠️ NOTHING ON A CARD IS INVENTED. A figure the screenshot did not show is
   null, and a null renders as nothing at all — never a zero, never a dash
   wall, never a plausible "from £599".
   ══════════════════════════════════════════════════════════════ */

let board = [], replies = {};

const money = (h) => (h.price == null ? '' :
    (h.currency && h.currency !== 'GBP' ? h.currency + ' ' : '£')
    + Number(h.price).toLocaleString('en-GB'));

const ukDate = (iso) => {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d))
        .toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
};

async function loadBoard() {
    try {
        const [b, r, c] = await Promise.all([
            fetch('/api/trips/board').then(x => x.json()),
            fetch('/api/trips/board/replies').then(x => x.json()).catch(() => ({ replies: {} })),
            fetch('/api/trips/board/calendar').then(x => x.json()).catch(() => ({ trips: [] })),
        ]);
        board = b.holidays || [];
        replies = r.replies || {};
        drawDiary(c.trips || []);
        drawBoard();
    } catch {
        $('board-cards').innerHTML = '<p class="board-empty">Could not load your board just now.</p>';
    }
}

/* The trips that are actually happening. Only real, confirmed dates get here —
   a printed "5-12 Oct" off a listing is not a date until she says it is. */
function drawDiary(trips) {
    const el = $('diary');
    if (!trips.length) { el.classList.add('hide'); el.innerHTML = ''; return; }
    el.classList.remove('hide');
    el.innerHTML = trips.map(t => `
        <div class="trip-chip ${t.past ? 'past' : ''}">
          ${t.onCalendar ? '<i class="marked" title="on your calendar"></i>' : ''}
          <div>
            <div class="when">${esc(ukDate(t.startDate))}${t.endDate ? ' – ' + esc(ukDate(t.endDate)) : ''}</div>
            <div class="where">${esc(t.where || t.title)}</div>
          </div>
          ${t.nights ? `<span class="away">${t.nights} nights</span>` : ''}
        </div>`).join('');
}

function drawBoard() {
    $('board-count').textContent = board.length
        ? `${board.length} kept` : '';
    $('send-board').style.display = board.length ? '' : 'none';

    if (!board.length) {
        $('board-cards').innerHTML = '';
        return;
    }

    $('board-cards').innerHTML = board.map(h => {
        const r = h.linkmailToken ? replies[h.linkmailToken] : null;
        const said = r ? r.answers.filter(a => a.said) : [];
        const initial = (h.company || h.title || '?').trim().charAt(0).toUpperCase();
        return `
        <article class="hol" data-id="${esc(h.id)}">
          <div class="top">
            <div class="brand">${h.logo
                ? `<img src="${esc(h.logo)}" alt="${esc(h.company)}" loading="lazy" />`
                : esc(initial)}</div>
            <h3>${esc(h.title)}${(h.place || h.country)
                ? `<small>${esc([h.place, h.country].filter(Boolean).join(', '))}</small>` : ''}</h3>
          </div>

          ${money(h) ? `<div class="cost">${money(h)}${h.priceBasis
                ? `<span class="basis">${esc(h.priceBasis)}</span>` : ''}</div>` : ''}

          <div class="lines">
            ${h.dates ? `<span>${esc(h.dates)}</span>` : ''}
            ${h.nights ? `<span><b>${h.nights}</b> nights</span>` : ''}
            ${h.boardBasis ? `<span>${esc(h.boardBasis)}</span>` : ''}
            ${h.company ? `<span>with <b>${esc(h.company)}</b></span>` : ''}
            ${h.rating != null ? `<span><b>${h.rating}</b>${h.reviewCount ? ` / ${h.reviewCount} reviews` : ''}</span>` : ''}
          </div>

          ${h.pros.length ? `<ul class="pc-list">${h.pros.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
          ${h.cons.length ? `<ul class="pc-list bad">${h.cons.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}

          ${said.length ? `<div class="said">${said.map(a => `
             <div class="say"><b>${esc(a.who || 'They')}</b>: ${esc(a.said)}
               <span class="q">${esc(a.question)}</span></div>`).join('')}</div>` : ''}
          ${r && r.said.length ? `<div class="said">${r.said.map(s => `
             <div class="say">${esc(s)}</div>`).join('')}</div>` : ''}

          <div class="dates-row">
            <div class="fld"><label>Going out</label>
              <input type="date" data-f="startDate" value="${esc(h.startDate || '')}" /></div>
            <div class="fld"><label>Coming home</label>
              <input type="date" data-f="endDate" value="${esc(h.endDate || '')}" /></div>
          </div>

          <div class="foot">
            <button class="mini" data-cal="${esc(h.id)}">${h.calendarEventId ? 'Take off calendar' : 'Put in calendar'}</button>
            ${h.link ? `<a class="visit" href="${esc(h.link)}" target="_blank" rel="noopener noreferrer">Open it &rarr;</a>` : ''}
            <span class="stamp-src">${esc(h.source)} &middot; ${esc(ukDate((h.foundAt || '').slice(0, 10)))}</span>
            <button class="mini" data-drop-hol="${esc(h.id)}">Remove</button>
          </div>
        </article>`;
    }).join('');
}

/* ── the drop ───────────────────────────────────────────────
   Drag a screenshot on, paste one, or tap to pick. A phone screenshot is
   several megabytes of pixels that a reader does not need, so it is scaled
   down here before it ever goes near the network. */
const MAX_EDGE = 1600;

function shrink(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.86));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
        img.src = url;
    });
}

let readingShot = false;

async function takeShot(file) {
    if (!file || readingShot) return;
    if (!/^image\//.test(file.type)) { say('That was not an image.'); return; }
    readingShot = true;
    const zone = $('drop');
    zone.classList.add('busy');
    const wasHtml = zone.innerHTML;
    zone.innerHTML = '<span class="spin"></span><div class="sub">Reading it</div>';
    say('');
    try {
        const image = await shrink(file);
        const res = await fetch('/api/trips/board/read', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image }),
        });
        const j = await res.json();
        if (!j.ok) { say(j.message || 'That screenshot could not be read.'); return; }
        if (j.notAListing) {
            say(`That does not look like a holiday listing${j.sawInstead ? ' — it looks like ' + j.sawInstead : ''}.`);
            return;
        }
        showFound(j);
    } catch (e) {
        say('That screenshot could not be read.');
    } finally {
        readingShot = false;
        zone.classList.remove('busy');
        zone.innerHTML = wasHtml;
    }
}

/* What it read, in boxes, BEFORE it becomes a card. A vision model reading a
   picture wrong is a normal Tuesday — she sees it and fixes it first. */
function showFound(f) {
    const box = $('found');
    const fld = (key, label, value, ph, wide) => `
        <div class="fld ${wide ? 'wide' : ''}"><label>${label}</label>
          <input data-nf="${key}" value="${esc(value == null ? '' : value)}" placeholder="${ph || ''}" /></div>`;
    box.innerHTML = `
        <h3>${esc(f.title || 'What did you find?')}</h3>
        <div class="from">${esc([f.place, f.country].filter(Boolean).join(', ')) || 'Check it over before you keep it'}</div>
        <div class="found-grid">
          ${fld('title', 'Name', f.title, '', true)}
          ${fld('place', 'Place', f.place)}
          ${fld('country', 'Country', f.country)}
          ${fld('price', 'Price', f.price, 'not shown')}
          ${fld('priceBasis', 'Price is', f.priceBasis, 'per person / total')}
          ${fld('dates', 'Dates', f.dates, 'not shown')}
          ${fld('nights', 'Nights', f.nights)}
          ${fld('boardBasis', 'Board', f.boardBasis)}
          ${fld('company', 'Company', f.company)}
          ${fld('link', 'Link', '', 'paste the page address', true)}
        </div>
        <div class="acts">
          <button class="btn" id="keep-it" type="button">Keep it</button>
          <button class="mini" id="bin-it" type="button">Bin it</button>
          <span class="warn">${f.price == null ? 'No price on the screenshot, so none has been put in.' : ''}</span>
        </div>`;
    box.classList.remove('hide');
    box.dataset.pros = JSON.stringify(f.pros || []);
    box.dataset.cons = JSON.stringify(f.cons || []);
    box.dataset.logo = f.logo || '';
    box.dataset.rating = f.rating == null ? '' : f.rating;
    box.dataset.reviewCount = f.reviewCount == null ? '' : f.reviewCount;
    // Suggested by the server from the printed dates; null unless it was sure.
    box.dataset.start = f.startDate || '';
    box.dataset.end = f.endDate || '';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function keepFound() {
    const box = $('found');
    const body = { source: 'screenshot' };
    box.querySelectorAll('[data-nf]').forEach(i => { body[i.dataset.nf] = i.value.trim(); });
    body.pros = JSON.parse(box.dataset.pros || '[]');
    body.cons = JSON.parse(box.dataset.cons || '[]');
    body.logo = box.dataset.logo || '';
    body.rating = box.dataset.rating || null;
    body.reviewCount = box.dataset.reviewCount || null;
    // Only ever a suggestion — it lands in the two date boxes on the card,
    // and nothing reaches her calendar until she presses the button there.
    body.startDate = box.dataset.start || null;
    body.endDate = box.dataset.end || null;

    const res = await fetch('/api/trips/board', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    const j = await res.json();
    if (!j.ok) { say(j.message || 'That could not be kept.'); return; }
    box.classList.add('hide');
    await loadBoard();
}

/* ── wiring ─────────────────────────────────────────────────── */
const dropZone = $('drop');
dropZone.addEventListener('click', () => { if (!readingShot) $('shot-file').click(); });
$('shot-file').addEventListener('change', e => takeShot(e.target.files[0]));
['dragenter', 'dragover'].forEach(t => dropZone.addEventListener(t, e => {
    e.preventDefault(); dropZone.classList.add('over');
}));
['dragleave', 'drop'].forEach(t => dropZone.addEventListener(t, e => {
    e.preventDefault(); dropZone.classList.remove('over');
}));
dropZone.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) takeShot(f);
});
/* Paste works anywhere on the page — screenshotting and pasting is one motion
   and hunting for the right box to click first would break it. */
window.addEventListener('paste', e => {
    for (const item of (e.clipboardData && e.clipboardData.items) || []) {
        if (item.type && item.type.startsWith('image/')) { takeShot(item.getAsFile()); return; }
    }
});

document.addEventListener('click', async (e) => {
    if (e.target.id === 'keep-it') { keepFound(); return; }
    if (e.target.id === 'bin-it') { $('found').classList.add('hide'); return; }

    const gone = e.target.closest('[data-drop-hol]');
    if (gone) {
        await fetch('/api/trips/board/' + gone.dataset.dropHol, { method: 'DELETE' });
        loadBoard();
        return;
    }

    const cal = e.target.closest('[data-cal]');
    if (cal) {
        const id = cal.dataset.cal;
        const h = board.find(x => x.id === id);
        const method = h && h.calendarEventId ? 'DELETE' : 'POST';
        const res = await fetch('/api/trips/board/' + id + '/calendar', { method });
        const j = await res.json();
        if (!j.ok) say(j.message || 'That did not go on the calendar.');
        loadBoard();
        return;
    }

    if (e.target.id === 'send-board') {
        e.target.disabled = true;
        try {
            const res = await fetch('/api/trips/board/share', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'Where shall we go?' }),
            });
            const j = await res.json();
            if (!j.ok) { say(j.message || 'That could not be sent.'); return; }
            $('lm-url').value = j.fullUrl;
            $('lm-row').classList.remove('hide');
            $('lm-row').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            loadBoard();
        } finally { e.target.disabled = false; }
    }
});

/* A date typed onto a card is saved the moment she leaves the box. */
document.addEventListener('change', async (e) => {
    const card = e.target.closest('.hol');
    if (!card || !e.target.dataset.f) return;
    const patch = {};
    patch[e.target.dataset.f] = e.target.value || null;
    await fetch('/api/trips/board/' + card.dataset.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
    });
    loadBoard();
});

loadBoard();
</script>
